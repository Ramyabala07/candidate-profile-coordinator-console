<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidate Profile — Coordinator Console V8</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
:root{--font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
 --bg:#F3F4F6;--surface:#fff;--border:#E5E7EB;--border-h:#D1D5DB;--tp:#111827;--tt:#6B7280;--accent:#1D4ED8}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--surface:#1F2937;--border:#374151;--border-h:#4B5563;--tp:#F3F4F6;--tt:#9CA3AF;--accent:#60A5FA}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tp);font:400 15px/22px var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{max-width:1120px;margin:0 auto;padding:48px 24px 64px}
h1{font:500 24px/32px var(--font);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--border-h);box-shadow:0 8px 24px rgba(17,24,39,.08)}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top left;border-bottom:1px solid var(--border)}
.card h2{font:500 15px/22px var(--font);margin:0;padding:14px 16px}
</style>
</head>
<body>
<main>
 <h1>Candidate Profile — Coordinator Console V8</h1>
 <div class="grid">
  <a class="card" href="prototypes/cp-final-2.html">
   <img src="thumbs/cp-final-2.png" alt="CP Final 2: an accommodation request with its reply and Approve, Decline and Request info">
   <h2>CP Final 2</h2>
  </a>
  <a class="card" href="prototypes/cp-final-1.html">
   <img src="thumbs/cp-final-1.png" alt="CP Final 1: the donut result and the credential card in the candidate profile">
   <h2>CP Final 1</h2>
  </a>
  <a class="card" href="prototypes/score-visualisations.html">
   <img src="thumbs/score-visualisations.png" alt="Score visualisations: the spider view with a section open">
   <h2>Score visualisations</h2>
  </a>
  <a class="card" href="prototypes/candidate-profile-v2.html">
   <img src="thumbs/v2.png" alt="Candidate profile with the bar graph score card open">
   <h2>Bar graph</h2>
  </a>
  <a class="card" href="prototypes/enrollment-profile.html?v=c">
   <img src="thumbs/cards.png" alt="Enrollment profile, Cards variant">
   <h2>Cards</h2>
  </a>
  <a class="card" href="prototypes/enrollment-profile.html?v=a">
   <img src="thumbs/timeline.png" alt="Enrollment profile, Timeline variant">
   <h2>Timeline</h2>
  </a>
 </div>
</main>
</body>
</html>
