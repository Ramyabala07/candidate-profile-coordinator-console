<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Candidate Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;
  --g500:#6B7280;--g600:#4B5563;--g700:#374151;--g800:#1F2937;--g900:#111827;
  --b50:#EFF6FF;--b100:#DBEAFE;--b200:#BFDBFE;--b600:#2563EB;--b700:#1D4ED8;--b800:#1E40AF;
  --r50:#FEF2F2;--r300:#FCA5A5;--r600:#DC2626;--r700:#B91C1C;
  --o50:#FFF7ED;--o300:#FDBA74;--o600:#EA580C;--o700:#C2410C;
  --gr50:#F0FDF4;--gr300:#86EFAC;--gr600:#16A34A;--gr700:#15803D;
  --tl50:#F0FDFA;--tl300:#5EEAD4;--tl700:#0F766E;
  --surface:#fff;--border:var(--g200);--bd2:var(--g300);
  --tp:var(--g900);--ts:var(--g700);--tt:var(--g500);--accent:var(--b700);
  --sh:0 1px 2px rgba(17,24,39,.06);
  --shl:0 10px 34px rgba(17,24,39,.14),0 2px 6px rgba(17,24,39,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--g100);color:var(--tp);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.proto{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--g900);color:#fff;position:sticky;top:0;z-index:100}
.proto .ttl{font:500 12px/16px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--g400)}
.proto .hint{margin-left:auto;font:400 12px/16px var(--font);color:var(--g400)}

.app{position:relative;display:flex;height:calc(100vh - 44px);min-height:700px;background:var(--surface);overflow:hidden}
.rail{width:52px;flex:0 0 52px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:14px}
.rail .ic{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.rail .ic.on{background:var(--g100);color:var(--g900)}
.rail .sp{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

.crumb{display:flex;align-items:center;gap:8px;padding:13px 22px;border-bottom:1px solid var(--border);font:400 14px/21px var(--font);color:var(--tt);flex:0 0 auto}
.crumb .lk{color:var(--accent)}
.crumb .lk:hover{text-decoration:underline}
.crumb b{font-weight:500;color:var(--tp)}
.crumb .sl{color:var(--g300)}
.crumb .rt{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.ibtn:hover{background:var(--g100);color:var(--tp)}
.vdiv{width:1px;height:20px;background:var(--border);margin:0 5px}

.wrap{flex:1;min-height:0;display:flex}
.page{flex:1;min-width:0;overflow-y:auto;padding:20px 22px 40px}
.page.narrow{padding-right:16px}

/* ---- identity band ---- */
.band{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);gap:16px;margin-bottom:22px}
@media (max-width:1080px){.band{grid-template-columns:1fr}}
.idcard{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--surface);display:flex;gap:13px}
.av{width:52px;height:52px;flex:0 0 52px;border-radius:50%;background:var(--b50);color:var(--b800);
  display:flex;align-items:center;justify-content:center;font:500 17px/1 var(--font)}
.idb{min-width:0;flex:1}
.idb .nm{display:flex;align-items:center;gap:7px;font:500 18px/26px var(--font)}
.mini{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px}
.mini.parent{background:var(--b50);color:var(--b700)}
.mini.acc{background:var(--gr50);color:var(--gr700)}
.idb .sub{font:400 12.5px/19px var(--font);color:var(--tt);margin-top:2px}
.idb .ct{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.idb .ct a{display:flex;align-items:center;gap:7px;font:400 12.5px/19px var(--font);color:var(--ts);text-decoration:none}
.idb .ct a:hover{color:var(--accent);text-decoration:underline}
.idb .ct svg{color:var(--g400);flex:0 0 auto}

.attn{border:1px solid var(--o300);border-radius:12px;background:var(--o50);padding:14px 16px}
.attn.clear{border-color:var(--gr300);background:var(--gr50)}
.attn h3{margin:0 0 2px;font:500 14px/21px var(--font);color:var(--o700);display:flex;align-items:center;gap:8px}
.attn.clear h3{color:var(--gr700)}
.attn .note{font:400 12.5px/19px var(--font);color:var(--ts)}
.attn .list{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.arow{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 11px;border-radius:8px;background:var(--surface);
  border:1px solid var(--o300);transition:box-shadow .12s}
.arow.e{border-color:var(--r300)}
.arow:hover{box-shadow:var(--sh);border-color:var(--o600)}
.arow.e:hover{border-color:var(--r600)}
.arow .mk{display:block;flex:0 0 15px;padding-top:2px;color:var(--o700)}
.arow.e .mk{color:var(--r700)}
.arow .bd{display:block;flex:1;min-width:0}
.arow .t{display:block;font:500 13px/19px var(--font)}
.arow .s{display:block;font:400 12px/18px var(--font);color:var(--tt);margin-top:1px}
.arow .go{display:block;flex:0 0 auto;color:var(--g400);padding-top:2px}
.flagline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--o300);
  font:400 11.5px/18px var(--font);color:var(--ts)}
.attn.clear .flagline{border-top-color:var(--gr300)}
.flagline b{font-weight:500;color:var(--tt);margin-right:2px}
.flagline button{display:inline-flex;align-items:baseline;gap:6px;padding:2px 9px;border-radius:99px;
  border:1px dashed var(--o300);background:var(--surface);font:400 11.5px/18px var(--font);color:var(--o700)}
.flagline button span{color:var(--tt);font-size:11px}
.flagline button:hover{border-style:solid;background:var(--o50)}
.arow:hover .go{color:var(--accent)}

/* ---- section heads ---- */
.sec{margin-bottom:24px}
.sech{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sech h2{margin:0;font:500 11px/16px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--g600)}
.sech .ct{font:400 12px/18px var(--font);color:var(--tt)}
.sech .rt{margin-left:auto;display:flex;align-items:center;gap:13px}
.leg{display:flex;align-items:center;gap:11px;font:400 11px/16px var(--font);color:var(--tt)}
.leg span{display:inline-flex;align-items:center;gap:5px}

/* ---- the matrix ---- */
.mx{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.mxs{overflow-x:auto}
.mxt{width:100%;border-collapse:collapse;min-width:820px}
.mxt th{font:400 11px/15px var(--font);color:var(--g600);font-weight:400;padding:9px 4px;text-align:center;
  background:var(--g50);border-bottom:1px solid var(--border);white-space:nowrap}
.mxt th.lbl{text-align:left;padding-left:14px;width:250px;position:sticky;left:0;background:var(--g50);z-index:2}
.mxt th.st{text-align:right;padding-right:14px;width:150px;position:sticky;right:0;background:var(--g50);z-index:2}
.mxt td{padding:0;border-bottom:1px solid var(--border);vertical-align:middle}
.mxt tr:last-child td{border-bottom:none}
.exrow td{background:var(--g50);padding:7px 14px;font:500 12px/18px var(--font);color:var(--g700);position:sticky;left:0}
.exrow .code{font-weight:500}
.exrow .nm2{font-weight:400;color:var(--tt)}
.exrow .ct2{float:right;font-weight:400;color:var(--tt);font-size:11.5px}
.enr{cursor:pointer}
.enr:hover td{background:var(--b50)}
.enr.on .lbl,.enr.on .st,.enr:hover .lbl,.enr:hover .st{background:var(--b50)}
.enr.on td{background:var(--b50);box-shadow:inset 3px 0 0 var(--b600)}
.enr .lbl{padding:10px 14px;width:250px;position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--border)}
.enr .lbl b{display:block;font:500 13.5px/20px var(--font)}
.enr .lbl span{display:block;font:400 11.5px/17px var(--font);color:var(--tt)}
.cell{text-align:center;padding:0}
.cellb{width:100%;height:42px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.cellb:hover{background:rgba(37,99,235,.10)}
.dot{width:11px;height:11px;border-radius:50%;display:block}
.dot.done{background:var(--gr600)}
.dot.attention{background:var(--o600)}
.dot.blocked{background:var(--r600)}
.dot.flag{background:none;border:2.5px solid var(--o600)}
.dot.up{background:none;border:1.5px solid var(--g300)}
.dot.na{width:8px;height:2px;border-radius:1px;background:var(--g200)}
.enr .st{text-align:right;padding:10px 14px;position:sticky;right:0;background:var(--surface);z-index:1;box-shadow:-1px 0 0 var(--border)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font:500 12px/19px var(--font);border:1px solid;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.ok{background:var(--gr50);color:var(--gr700);border-color:var(--gr300)}
.pill.info{background:var(--b50);color:var(--b800);border-color:var(--b200)}
.pill.warn{background:var(--o50);color:var(--o700);border-color:var(--o300)}
.pill.err{background:var(--r50);color:var(--r700);border-color:var(--r300)}
.pill.mute{background:var(--g100);color:var(--g600);border-color:var(--g300)}
.pill.teal{background:var(--tl50);color:var(--tl700);border-color:var(--tl300)}

/* ---- identity lineup ---- */
.lineup{display:flex;gap:10px;overflow-x:auto;padding:2px}
.cap{flex:0 0 132px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);text-align:left}
.cap:hover{box-shadow:var(--sh);border-color:var(--bd2)}
.cap .im{display:block;height:96px;position:relative;background:var(--g100)}
.cap .tag{position:absolute;left:6px;top:6px;padding:1px 7px;border-radius:99px;font:500 10.5px/16px var(--font);background:rgba(255,255,255,.94);border:1px solid var(--border)}
.cap .tag.ref{color:var(--b800);border-color:var(--b200)}
.cap .tag.ok{color:var(--gr700);border-color:var(--gr300)}
.cap .tag.err{color:var(--r700);border-color:var(--r300)}
.cap.base{border-color:var(--b600);box-shadow:0 0 0 1px var(--b600)}
.cap .mt{display:block;padding:8px 9px}
.cap .mt b{display:block;font:500 12px/18px var(--font)}
.cap .mt span{display:block;font:400 11px/16px var(--font);color:var(--tt)}

/* ---- bottom band ---- */
.b2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:16px}
@media (max-width:1080px){.b2{grid-template-columns:1fr}}
.panelx{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.panelx > h3{margin:0;padding:11px 14px;background:var(--g50);border-bottom:1px solid var(--border);
  font:500 11px/16px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--g600);display:flex;align-items:center;gap:10px}
.chips{margin-left:auto;display:flex;gap:4px}
.chips button{padding:2px 9px;border-radius:99px;font:400 11px/17px var(--font);color:var(--tt);border:1px solid var(--border)}
.chips button.on{background:var(--g900);color:#fff;border-color:var(--g900)}
.lg{display:flex;gap:11px;padding:10px 14px;border-bottom:1px solid var(--border)}
.lg:last-child{border-bottom:none}
.lg .dt{display:block;flex:0 0 9px;padding-top:6px}
.lg .dt i{width:9px;height:9px;border-radius:50%;display:block}
.lg .bd{display:block;flex:1;min-width:0}
.lg .t{display:block;font:400 13px/19px var(--font)}
.lg .t b{font-weight:500}
.lg .m{display:block;font:400 11.5px/17px var(--font);color:var(--tt);margin-top:2px}
.extag{display:inline-block;padding:0 6px;border-radius:4px;background:var(--g100);color:var(--g600);font:500 10.5px/16px var(--font);margin-right:6px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 14px;border-bottom:1px solid var(--border);font:400 12.5px/19px var(--font)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tt);flex:0 0 auto}
.kv .v{text-align:right;color:var(--ts)}
.docs{display:flex;flex-wrap:wrap;gap:6px;padding:11px 14px}
.doc{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;border:1px solid var(--border);font:400 12px/18px var(--font);color:var(--ts)}
.doc:hover{border-color:var(--bd2);background:var(--g50)}

/* ---- side panel (non-modal peek) ---- */
.peek{flex:0 0 440px;width:440px;border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.peekh{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.peekh .bd{flex:1;min-width:0}
.peekh .ex{font:400 11.5px/17px var(--font);color:var(--tt)}
.peekh .t{font:500 15.5px/23px var(--font);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.peekb{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 26px}
.peekf{flex:0 0 auto;padding:11px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--g50)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;font:500 13px/19px var(--font);border:1px solid var(--bd2);color:var(--ts);background:var(--surface)}
.btn:hover{background:var(--g50)}
.btn.pri{background:var(--g900);color:#fff;border-color:var(--g900)}
.btn.pri:hover{background:var(--g800)}
.btn.sm{padding:4px 10px;font-size:12.5px}

.st{border:1px solid var(--border);border-radius:10px;margin-bottom:9px;overflow:hidden}
.st.attention{border-color:var(--o300)}
.st.blocked{border-color:var(--r300)}
.sth{display:flex;align-items:flex-start;gap:10px;width:100%;padding:11px 12px}
.sth:hover{background:var(--g50)}
.st.attention .sth{background:var(--o50)}
.st.blocked .sth{background:var(--r50)}
.sth .mk{display:block;flex:0 0 14px;padding-top:3px;color:var(--g300)}
.st.attention .sth .mk{color:var(--o700)}
.st.blocked .sth .mk{color:var(--r700)}
.sth .bd{display:block;flex:1;min-width:0}
.sth .t{display:block;font:500 13px/19px var(--font)}
.sth .v{display:block;font:400 12px/18px var(--font);color:var(--tt);margin-top:1px}
.st.attention .sth .v{color:var(--o700)}
.st.blocked .sth .v{color:var(--r700)}
.sth .rt{display:block;flex:0 0 auto;padding-top:1px}
.stb{padding:12px;border-top:1px solid var(--border)}
.st:not(.open) .stb{display:none}
.card{border:1px solid var(--border);border-radius:8px;margin-bottom:9px;overflow:hidden}
.card:last-child{margin-bottom:0}
.card h4{margin:0;padding:7px 11px;background:var(--g50);border-bottom:1px solid var(--border);
  font:400 10.5px/16px var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--g600)}
.rw{display:flex;justify-content:space-between;gap:12px;padding:7px 11px;border-bottom:1px solid var(--border);font:400 12.5px/19px var(--font)}
.rw:last-child{border-bottom:none}
.rw .k{color:var(--tt)}
.rw .v{text-align:right}
.vd{padding:9px 11px;border-radius:8px;font:400 12.5px/19px var(--font);margin-bottom:10px}
.vd b{font-weight:500}
.vd.ok{background:var(--gr50);color:var(--gr700)}
.vd.warn{background:var(--o50);color:var(--o700)}
.vd.err{background:var(--r50);color:var(--r700)}
.vd.info{background:var(--b50);color:var(--b800)}
.accr{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--border)}
.accr:last-child{border-bottom:none}
.accr .n{flex:1;font:400 12.5px/19px var(--font)}
.accr .acts{display:flex;gap:5px}
.sq{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;color:var(--g500)}
.sq:hover{background:var(--g50)}
.sq.no:hover{border-color:var(--r600);color:var(--r700);background:var(--r50)}
.sq.yes:hover{border-color:var(--gr600);color:var(--gr700);background:var(--gr50)}
.cmpx{display:flex;align-items:center;gap:9px;padding:11px}
.cmpx .sd{display:block;flex:1;min-width:0;text-align:center}
.cmpx .sd .im{display:block;height:86px;border-radius:8px;overflow:hidden;border:2px solid var(--border)}
.cmpx .sd .im.ok{border-color:var(--gr600)}.cmpx .sd .im.err{border-color:var(--r600)}.cmpx .sd .im.ref{border-color:var(--b600)}
.cmpx .sd b{display:block;font:500 11.5px/17px var(--font);margin-top:5px}
.cmpx .sd span{display:block;font:400 10.5px/16px var(--font);color:var(--tt)}
.cmpx .vs{display:block;flex:0 0 auto;font:500 10px/14px var(--font);color:var(--g400)}

.menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shl);padding:5px;z-index:300;min-width:224px}
.menu button{display:block;width:100%;padding:8px 11px;border-radius:7px;font:400 13px/19px var(--font);color:var(--ts)}
.menu button:hover{background:var(--g100);color:var(--tp)}
.menu .sp{height:1px;background:var(--border);margin:4px 0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--g900);color:#fff;
  padding:9px 16px;border-radius:9px;font:400 13px/19px var(--font);z-index:400;box-shadow:var(--shl)}
.empty{padding:26px 14px;text-align:center;color:var(--tt);font:400 12.5px/19px var(--font)}
</style>

<div class="proto">
  <span class="ttl">Candidate workspace</span>
  <span class="hint">Click any enrollment row, stage dot, or flagged item</span>
</div>
<div id="root"></div>

function accState(){ // enrollment 3's accommodations stage follows the live decisions
 const pend=ACC.filter(a=>!a.s).length;
 const st=byId('ds3').stages.find(s=>s.k==='accommodations');
 if(pend){st.st='attention';st.chip=[pend+' pending review','warn'];st.sum='Waiting on your decision for 12 days';
   st.blocks[0]=VD('warn','<b>'+pend+' request'+(pend>1?'s':'')+' awaiting your decision.</b> The candidate cannot be scheduled until each one is decided.');}
 else{const app=ACC.filter(a=>a.s==='y');
   st.st='done';st.chip=[app.length?'Approved':'Declined',app.length?'ok':'mute'];
   st.sum=app.length?app.map(a=>a.n).join(', ')+' approved':'Both requests declined';
   st.blocks[0]=VD(app.length?'ok':'info',app.length
     ? '<b>Decided.</b> '+app.map(a=>a.n).join(' and ')+' will be applied to every session on this enrollment.'
     : '<b>Decided.</b> Both requests were declined — the candidate sits under standard conditions.');}
}
function derived(e){
 accState();
 const st=e.stages;
 if(st.some(s=>s.k==='session'&&s.chip[0]==='Cancelled')) return ['Cancelled','mute'];
 if(st.some(s=>s.k==='score')) return ['Completed','teal'];
 if(st.some(s=>s.st==='blocked')) return ['Pending Approval','warn'];
 if(st.some(s=>s.st==='attention')) return ['Pending Approval','warn'];
 if(st.some(s=>s.k==='session'&&s.st==='done')) return ['Enrolled','ok'];
 return ['In Progress','info'];
}
function attention(){
 accState();
 const out=[];
 ENR.forEach(e=>e.stages.forEach(s=>{
   if(s.st==='attention'||s.st==='blocked') out.push({e,s,k:s.st==='blocked'?'e':'w'});
 }));
 return out.sort((a,b)=>(a.k==='e'?-1:1)-(b.k==='e'?-1:1));
}
function flags(){

}

       <span><i class="dot done"></i>Done</span>
       <span><i class="dot attention"></i>Needs a decision</span>
       <span><i class="dot blocked"></i>Blocked</span>
       <span><i class="dot flag"></i>Flagged, no action</span>
       <span><i class="dot up"></i>Not started</span>
       <span><i class="dot na"></i>Not in this workflow</span>
     </span></span></div>
   <div class="mx"><div class="mxs"><table class="mxt"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>
 </div>`;
}

function lineupH(){
 return `<div class="sec">
  <div class="sech"><h2>Identity across exams</h2>
    <span class="ct">${LINEUP.length} captures &middot; ${LINEUP.filter(c=>c.tag[1]==='err').length} flagged</span></div>
  <div class="lineup">${LINEUP.map(c=>`<button class="cap ${c.base?'base':''}" data-cap="${E(c.e)}">
    <span class="im">${FACE(c.hue)}<span class="tag ${c.tag[1]}">${E(c.tag[0])}</span></span>
    <span class="mt"><b>${E(c.cap)}</b><span>${E(c.when)}</span></span></button>`).join('')}</div>
 </div>`;
}

function bottomH(){
 const rows=LOG.filter(l=>logEx==='all'||l[0]===logEx);
 const dot={g:'var(--gr600)',a:'var(--o600)',r:'var(--r600)'};
 return `<div class="b2">
  <div class="panelx"><h3>Activity across exams
    <span class="chips">
      <button data-logex="all" class="${logEx==='all'?'on':''}">All</button>
      ${Object.keys(EXAMS).map(k=>`<button data-logex="${k}" class="${logEx===k?'on':''}">${E(EXAMS[k].code)}</button>`).join('')}
    </span></h3>
   ${rows.length?rows.map(l=>`<button class="lg" data-attn="${E(l[5])}|">
     <span class="dt"><i style="background:${dot[l[1]]}"></i></span>
     <span class="bd"><span class="t"><span class="extag">${E(EXAMS[l[0]].code)}</span><b>${E(l[2])}</b></span>
       <span class="m">${E(l[3])}${l[4]?' &middot; '+E(l[4]):''}</span></span></button>`).join(''):`<div class="empty">No activity for this exam.</div>`}
  </div>
  <div>
   <div class="panelx" style="margin-bottom:16px"><h3>Profile</h3>
    <div class="kv"><span class="k">Date of birth</span><span class="v">${E(CAND.dob)} &middot; minor</span></div>
    <div class="kv"><span class="k">External ID</span><span class="v">${E(CAND.ext)}</span></div>
    <div class="kv"><span class="k">Time zone</span><span class="v">${E(CAND.tz)}</span></div>
    <div class="kv"><span class="k">Source</span><span class="v">${E(CAND.src)}</span></div>
    <div class="kv"><span class="k">First enrolled</span><span class="v">${E(CAND.first)}</span></div>
   </div>
   <div class="panelx"><h3>Documents on file</h3>
    <div class="docs">
     <button class="doc">${I.doc} Passport</button>
     <button class="doc">${I.doc} Guardian ID</button>
     <button class="doc">${I.doc} Medical-note.pdf</button>
     <button class="doc">${I.doc} Certificate PY0287</button>
    </div>
   </div>
  </div>
 </div>`;
}

function blockH(b){
 if(b.t==='vd') return `<div class="vd ${b.k}">${b.html}</div>`;
 if(b.t==='rows') return `<div class="card"><h4>${E(b.title)}</h4>
   ${b.items.map(r=>`<div class="rw"><span class="k">${E(r[0])}</span><span class="v">${E(r[1])}</span></div>`).join('')}</div>`;
 if(b.t==='cmp') return `<div class="card"><h4>Comparison</h4><div class="cmpx">
   <span class="sd"><span class="im ${b.a[2]}">${FACE(b.a[3])}</span><b>${E(b.a[0])}</b><span>${E(b.a[1])}</span></span>
   ${b.b?`<span class="vs">VS</span><span class="sd"><span class="im ${b.b[2]}">${FACE(b.b[3])}</span><b>${E(b.b[0])}</b><span>${E(b.b[1])}</span></span>`:''}
  </div></div>`;
 if(b.t==='acc') return `<div class="card"><h4>Requested accommodations</h4>
   ${ACC.map((a,i)=>`<div class="accr"><span class="mini acc" style="background:var(--g100);color:var(--g600)">${I[a.ic]}</span>
     <span class="n">${E(a.n)}</span>
     ${a.s?`<span class="pill ${a.s==='y'?'ok':'mute'}">${a.s==='y'?'Approved':'Declined'}</span>
        <button class="sq" data-accclr="${i}" title="Change decision">${I.edit}</button>`
       :`<span class="acts"><button class="sq no" data-accset="${i}|n" title="Decline">${I.cross}</button>
         <button class="sq yes" data-accset="${i}|y" title="Approve">${I.tick}</button></span>`}
    </div>`).join('')}
   ${ACC.every(a=>a.s)?`<div class="rw"><span class="k">Reviewed by</span><span class="v">Divya K. &middot; today</span></div>`:''}
  </div>`;
 return '';
}

function peekH(){
 const e=byId(sel); if(!e) return '';
 const d=derived(e), x=exOf(e);
 const mk={done:I.done,attention:I.excl,blocked:I.stop,up:I.circ};
 return `<div class="peek">
  <div class="peekh">
   <div class="bd"><div class="ex">${E(x.code)} &middot; ${E(x.name)}</div>
     <div class="t">${E(e.label)} ${pill(d)}</div>
     <div class="ex" style="margin-top:2px">${E(e.period)}</div></div>
   <button class="ibtn" data-peekclose="1" title="Close">${I.x}</button>
  </div>
  <div class="peekb" id="peekb">
   ${e.stages.slice().reverse().map(s=>{
     const k=e.id+'|'+s.k, op=openStage[k];
     return `<div class="st ${s.st} ${op?'open':''}">
       <button class="sth" data-stage="${E(k)}">
         <span class="mk">${mk[s.st]||I.circ}</span>
         <span class="bd"><span class="t">${E(FULL[s.k])}</span><span class="v">${E(s.sum)}</span></span>
         <span class="rt">${pill(s.chip)}</span></button>
       <div class="stb">${s.blocks.length?s.blocks.map(blockH).join(''):`<div class="empty" style="padding:10px">Nothing further recorded on this stage.</div>`}</div>
     </div>`;}).join('')}
  </div>
  <div class="peekf">
   <button class="btn pri" data-open="1">Open enrollment profile ${I.ext}</button>
   <span style="flex:1"></span>
   <button class="ibtn" data-menu="enr" title="Enrollment actions">${I.dots}</button>
  </div>
 </div>`;
}

function render(){
 const sc=document.getElementById('peekb'); const sp=sc?sc.scrollTop:0;
 const pg=document.querySelector('.page'); const pp=pg?pg.scrollTop:0;
 document.getElementById('root').innerHTML=`<div class="app">
  <div class="rail"><span class="ic">${I.burger}</span><span class="ic on">${I.home}</span>
    <span class="ic">${I.clip}</span><span class="sp"></span><span class="ic">${I.help}</span></div>
  <div class="main">
   <div class="crumb">
     <button class="lk" data-noop="1">Exams</button><span class="sl">/</span>
     <button class="lk" data-noop="1">Candidates</button><span class="sl">/</span>
     <b>${E(CAND.n)}</b>
     <span class="rt">
       <button class="ibtn" data-cand="-1" title="Previous candidate">${I.chevL}</button>
       <button class="ibtn" data-cand="1" title="Next candidate">${I.chev}</button>
       <span class="vdiv"></span>
       <button class="ibtn" data-menu="cand" title="Candidate actions">${I.dots}</button>
     </span>
   </div>
   <div class="wrap">
    <div class="page ${sel?'narrow':''}">
      ${bandH()}${matrixH()}${lineupH()}${bottomH()}
    </div>
    ${sel?peekH():''}
   </div>
  </div>
 </div>${toast?`<div class="toast">${E(toast)}</div>`:''}`;
 const nb=document.getElementById('peekb'); if(nb)nb.scrollTop=sp;
 const np=document.querySelector('.page'); if(np)np.scrollTop=pp;
}

/* ===================== interaction ===================== */
function flash(m){toast=m;render();clearTimeout(flash.t);flash.t=setTimeout(()=>{toast=null;render();},1800);}
function closeMenu(){document.querySelectorAll('.menu').forEach(m=>m.remove());}
function showMenu(anchor,items){
 closeMenu();
 const r=anchor.getBoundingClientRect(), d=document.createElement('div');
 d.className='menu';
 d.innerHTML=items.map(i=>i==='-'?'<div class="sp"></div>':`<button data-mi="${E(i)}">${E(i)}</button>`).join('');
 document.body.appendChild(d);
 d.style.top=Math.min(r.bottom+6,innerHeight-d.offsetHeight-10)+'px';
 d.style.left=Math.max(10,r.right-d.offsetWidth)+'px';
}
function selectStage(id,k){
 sel=id;
 if(k){openStage[id+'|'+k]=true;selStage=k;}
 render();
 if(k)requestAnimationFrame(()=>{
   const el=[...document.querySelectorAll('[data-stage]')].find(b=>b.dataset.stage===id+'|'+k);
   if(el)el.scrollIntoView({block:'center'});
 });
}
document.addEventListener('click',e=>{
 const mi=e.target.closest('[data-mi]');
 if(mi){const t=mi.dataset.mi;closeMenu();flash(t+' — prototype stub');return;}
 if(!e.target.closest('.menu'))closeMenu();
 if(e.target.closest('[data-noop]')){e.preventDefault();return;}

 const mn=e.target.closest('[data-menu]');
 if(mn){showMenu(mn, mn.dataset.menu==='cand'
   ? ['Email candidate','Call candidate','-','Enroll in another exam','Export candidate record','-','Merge duplicate profile','Suspend candidate']
   : ['Manage accommodations','Reschedule session','Re-enroll candidate','-','Cancel enrollment']);
  return;}

 const cn=e.target.closest('[data-cand]');
 if(cn){candIdx=(candIdx+parseInt(cn.dataset.cand)+ROSTER.length)%ROSTER.length;flash('Showing '+ROSTER[candIdx]);return;}

 const at=e.target.closest('[data-attn]');
 if(at){const [id,k]=at.dataset.attn.split('|');selectStage(id,k||null);return;}
 const cl=e.target.closest('[data-cell]');
 if(cl){const [id,k]=cl.dataset.cell.split('|');
   const st=stageOf(byId(id),k);
   if(!st){flash(FULL[k]+' — '+(exOf(byId(id)).wf.includes(k)?'not started yet':'not part of this workflow'));return;}
   selectStage(id,k);return;}
 const er=e.target.closest('[data-enr]');
 if(er){sel=er.dataset.enr;render();return;}
 const cp=e.target.closest('[data-cap]');
 if(cp){selectStage(cp.dataset.cap,'identity');return;}

 if(e.target.closest('[data-peekclose]')){sel=null;render();return;}
 const sg=e.target.closest('[data-stage]');
 if(sg){openStage[sg.dataset.stage]=!openStage[sg.dataset.stage];render();return;}

 const lx=e.target.closest('[data-logex]');
 if(lx){logEx=lx.dataset.logex;render();return;}

 const as=e.target.closest('[data-accset]');
 if(as){const [i,v]=as.dataset.accset.split('|');ACC[+i].s=v;
   render();flash(ACC[+i].n+(v==='y'?' approved':' declined'));return;}
 const ac=e.target.closest('[data-accclr]');
 if(ac){ACC[+ac.dataset.accclr].s=null;render();flash('Decision cleared');return;}

 if(e.target.closest('[data-open]')){flash('Opening the full enrollment profile');return;}
});
addEventListener('resize',closeMenu,true);
render();
</script>

</body></html>
