<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>Candidate Profile v2 — Coordinator Console</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --font:'Roboto',system-ui,-apple-system,sans-serif;
 --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;
 --g500:#6B7280;--g600:#4B5563;--g700:#374151;--g800:#1F2937;--g900:#111827;
 --b50:#EFF6FF;--b100:#DBEAFE;--b200:#BFDBFE;--b600:#2563EB;--b700:#1D4ED8;--b800:#1E40AF;
 --r50:#FEF2F2;--r300:#FCA5A5;--r600:#DC2626;--r700:#B91C1C;
 --o50:#FFF7ED;--o300:#FDBA74;--o600:#EA580C;--o700:#C2410C;
 --gr50:#F0FDF4;--gr300:#86EFAC;--gr600:#16A34A;--gr700:#15803D;
 --tl50:#F0FDFA;--tl300:#5EEAD4;--tl700:#0F766E;
 --surface:#fff;--nested:var(--g50);--border:var(--g200);--bd2:var(--g300);
 --tp:var(--g900);--ts:var(--g700);--tt:var(--g500);--accent:var(--b700);
 --sh:0 1px 2px rgba(17,24,39,.06);--shl:0 10px 34px rgba(17,24,39,.14),0 2px 6px rgba(17,24,39,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--g100);color:var(--tp);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.proto{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--g900);color:#fff;position:sticky;top:0;z-index:100}
.proto .ttl{font:500 12px/16px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--g400)}
.proto .hint{margin-left:auto;font:400 12px/16px var(--font);color:var(--g400)}

.app{position:relative;display:flex;height:calc(100vh - 44px);min-height:700px;background:var(--surface);overflow:hidden}
.rail{width:52px;flex:0 0 52px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:14px}
.rail .ic{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.rail .ic.on{background:var(--g100);color:var(--g900)}
.rail .sp{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- original V8 list ---------- */
.crumb{display:flex;align-items:center;gap:8px;padding:16px 22px;border-bottom:1px solid var(--border);font:400 15px/22px var(--font);color:var(--tt);flex:0 0 auto}
.crumb b{font-weight:500;color:var(--tp)}
.tools{display:flex;align-items:center;gap:10px;padding:14px 22px;flex:0 0 auto}
.tabsx{display:flex;gap:3px;border:1px solid var(--border);border-radius:10px;padding:4px}
.tabsx button{padding:6px 13px;border-radius:7px;font:400 13.5px/20px var(--font);color:var(--ts);white-space:nowrap}
.tabsx button.on{background:var(--surface);color:var(--tp);font-weight:500;box-shadow:var(--sh);border:1px solid var(--border);padding:5px 12px}
.btnp{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:9px;
  background:var(--b700);color:#fff;font:500 13.5px/20px var(--font)}
.btnp:hover{background:var(--b800)}
.ibx{width:36px;height:36px;border:1px solid var(--bd2);border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--g600);flex:0 0 36px}
.ibx:hover{background:var(--g50)}
.srch{display:flex;align-items:center;gap:8px;width:230px;height:34px;padding:0 11px;border:1px solid var(--bd2);border-radius:8px;color:var(--g400)}
.srch input{border:none;outline:none;font:400 13.5px/20px var(--font);width:100%;background:none}
.iconbtn{height:34px;padding:0 12px;border:1px solid var(--bd2);border-radius:8px;display:flex;align-items:center;gap:7px;color:var(--g600);font:400 13.5px/20px var(--font)}
.iconbtn:hover{background:var(--g50)}
.tw{flex:1;overflow:auto;border-top:1px solid var(--border)}
table.t{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.t th{font:400 13px/18px var(--font);color:var(--g600);padding:13px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3;white-space:nowrap;text-align:left}
.t td{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap;vertical-align:middle}
.t tbody tr:nth-child(even) td{background:var(--g50)}
.t tbody tr:nth-child(even):hover td{background:var(--g100)}
.sortx{display:inline-flex;flex-direction:column;gap:1px;margin-left:6px;vertical-align:middle;color:var(--g400)}
.chn{display:inline-flex;gap:5px;margin-left:8px;align-items:center}
.chn i{width:19px;height:19px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.exch{width:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.idcell{position:relative;display:inline-flex}
.idcell .bg{position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;border:2px solid #fff}
.idcell .bg.ok{background:var(--gr600)}.idcell .bg.err{background:var(--r600)}
.more{color:var(--accent);text-decoration:underline}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--g50)}
.t .c1{position:sticky;left:0;z-index:2;min-width:300px;border-right:1px solid var(--border)}
.t th.c1{z-index:4}
.t tbody tr:hover .c1{background:var(--g50)}
.cand{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--font);color:#fff}
.nm{font:500 14px/20px var(--font)}
.em{font:400 12px/18px var(--font);color:var(--tt)}
.sub{font:400 12px/18px var(--font);color:var(--tt)}
.money{font-variant-numeric:tabular-nums}
.grn{color:var(--gr700)}.amb{color:var(--o700)}.red{color:var(--r700)}
.foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:11px 22px;border-top:1px solid var(--border);font:400 13px/20px var(--font);color:var(--ts)}
.foot .box{border:1px solid var(--bd2);border-radius:7px;padding:3px 10px;min-width:44px;text-align:center}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font:500 12px/18px var(--font);border:1px solid;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.pill.clear{background:var(--gr50);color:var(--gr700);border-color:var(--gr300)}
.pill.review{background:var(--o50);color:var(--o700);border-color:var(--o300)}
.pill.blocked{background:var(--r50);color:var(--r700);border-color:var(--r300)}
.pill.pending{background:var(--g100);color:var(--g600);border-color:var(--g300)}
.pill.info{background:var(--b50);color:var(--b800);border-color:var(--b200)}
.pill.done{background:var(--tl50);color:var(--tl700);border-color:var(--tl300)}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;font:500 12px/18px var(--font);white-space:nowrap}
.chip.clear{background:var(--gr50);color:var(--gr700)}
.chip.review{background:var(--o50);color:var(--o700)}
.chip.blocked{background:var(--r50);color:var(--r700)}
.chip.pending{background:var(--g100);color:var(--g600)}
.chip.info{background:var(--b50);color:var(--b700)}
.chip.done{background:var(--tl50);color:var(--tl700)}
/* credential bands — one hue each, used on the chip, the band bar, the card and the certificate */
.t-bz{--bm:#B45309;--bt:#78350F;--bs:#FFF7ED;--bb:#FED7AA;--bl:#FFEDD5}
.t-sv{--bm:#6B7280;--bt:#374151;--bs:#F9FAFB;--bb:#D1D5DB;--bl:#E5E7EB}
.t-gd{--bm:#A16207;--bt:#713F12;--bs:#FEFCE8;--bb:#FDE047;--bl:#FEF9C3}
.t-pt{--bm:#7E22CE;--bt:#581C87;--bs:#FAF5FF;--bb:#D8B4FE;--bl:#F3E8FF}
.chip.t-bz,.chip.t-sv,.chip.t-gd,.chip.t-pt{gap:6px;background:var(--bs);color:var(--bt);box-shadow:inset 0 0 0 1px var(--bb)}
.chip.t-bz::before,.chip.t-sv::before,.chip.t-gd::before,.chip.t-pt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bm)}

/* ---------- panel ---------- */
.scrim{position:absolute;inset:0;background:rgba(17,24,39,.5);z-index:60;display:flex;justify-content:flex-end}
.drawer{position:relative;width:560px;max-width:calc(100% - 120px);background:var(--surface);height:100%;
  display:flex;flex-direction:column;box-shadow:var(--shl)}
.dcbtn{position:absolute;right:100%;top:14px;margin-right:10px;width:34px;height:34px;border-radius:50%;
  background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--g800);box-shadow:var(--sh);z-index:2}
.dcbtn:hover{background:var(--g100)}
.phead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.phead .av{width:38px;height:38px;flex-basis:38px;font-size:13px}
.phid{min-width:0;flex:1}
.pname{display:flex;align-items:center;gap:7px;font:500 16px/24px var(--font);min-width:0}
.pname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:5px;flex:0 0 21px}
.mini.parent{color:var(--o700);background:var(--o50);border:1px solid var(--o300)}
.mini.acc{color:var(--gr700);background:var(--gr50);border:1px solid var(--gr300)}
.pmeta{font:400 12px/18px var(--font);color:var(--tt);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta .sl{color:var(--g300);margin:0 5px}
.hact{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.hnav{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--g400)}
.hnav:hover{background:var(--g100);color:var(--tp)}
.kbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--g600);border:1px solid var(--bd2)}
.kbtn:hover{background:var(--g50)}
.pbody{flex:1;min-height:0;overflow-y:auto}
.pinner{padding:16px}
.ctx{padding:15px 16px 0;font:400 13.5px/21px var(--font);color:var(--ts)}
.ctx b{font-weight:500;color:var(--tp)}

/* ---------- rail: neutral by default, colour only on the node and the chip ---------- */
.wfrail{padding:24px 16px 26px;position:relative}
.step{position:relative;padding-left:38px}
.step::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--border)}
.step.clear::before,.step.done::before{background:var(--gr300)}
.step.clear.nxp::before,.step.done.nxp::before{background:repeating-linear-gradient(180deg,var(--g300) 0 4px,transparent 4px 9px)}
.step.pending::before{background:repeating-linear-gradient(180deg,var(--g300) 0 4px,transparent 4px 9px)}
.step:first-child::before{top:12px}
.step:last-child::before{bottom:calc(100% - 12px)}
.node{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
 background:var(--surface);z-index:1;color:#fff}
.step.clear .node,.step.done .node{background:var(--gr600)}
.step.review .node{background:var(--o600)}
.step.blocked .node,.step.fail .node{background:var(--r600)}
.step.info .node{background:var(--b600)}
.step.pending .node{background:var(--surface);border:1.5px solid var(--g300);color:var(--g400);font:500 11px/1 var(--font)}
.node svg{width:12px;height:12px}
.step.canc::before,.step.canc.clear::before,.step.canc.pending::before{background:var(--g300)}
.step.canc .node,.step.canc.clear .node,.step.canc.pending .node{background:var(--g300);border:none;color:#fff}
.step.canc .ecard1,.step.canc .gin{opacity:.75}
.shd{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:1px 0 12px}
.shd .t{font:500 15px/22px var(--font)}
.shd .w{font:400 12px/18px var(--font);color:var(--g400);white-space:nowrap}
.step{padding-bottom:24px}
.step.muted{opacity:.5}
.gorow{display:inline-flex;align-items:center;gap:6px;margin:12px 0 0 10px;font:500 13px/20px var(--font);color:var(--accent)}
.gorow:hover{text-decoration:underline}
.upnote{margin:0 0 4px 4px;color:var(--tt);font:400 13px/20px var(--font)}

/* ---------- verity-grammar check rows ---------- */
.vgroup{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--nested)}
.vgroup.empty{opacity:.62}
.vgb{padding:9px;display:flex;flex-direction:column;gap:9px}
.vsub{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:12px 13px}
.vsub .hd{display:flex;align-items:center;gap:9px}
.vsub .hd .ic{display:flex;color:var(--g500);flex:0 0 16px}
.vsub .hd .t{flex:1;min-width:0;font:500 13.5px/20px var(--font)}
.vsub .fi{margin:7px 0 0;font:400 13.5px/20px var(--font);color:var(--ts)}
.vsub .ev2{margin-top:11px}
.vsub .pv{margin:3px 0 0;font:400 12px/18px var(--font);color:var(--g400)}
.vsub .src2{margin:9px 0 0;font:400 12px/18px var(--font);color:var(--g400)}
.vsub .th{width:calc(50% - 5px);max-width:none}
.vsub .th .im{height:112px}
.vsub .th .cp{font-weight:400;color:var(--tt);white-space:normal}
.th .cp .lk{color:var(--accent)}
.srcs{display:block;padding:4px 4px 2px;font:500 13px/20px var(--font);color:var(--accent)}
.srcs:hover{text-decoration:underline}
.vtot{font:500 17px/24px var(--font);margin:4px 0 12px}
.vctx b{font-weight:500}
.ct.na{font:400 12px/18px var(--font);color:var(--g400);background:none;border:none;padding:2px 0}
.ct b{font-weight:500}
.vfoot{display:flex;align-items:baseline;gap:12px;margin-top:16px;padding-top:13px;border-top:1px solid var(--border);
 font:400 12px/18px var(--font);color:var(--tt)}
.vfoot span{flex:1;min-width:0}
.vfoot button{font:400 12px/18px var(--font);color:var(--tt)}
.vfoot button:hover{color:var(--accent);text-decoration:underline}
.vgh{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:11px 13px;
 background:var(--nested);transition:background .12s}
.vgroup.op .vgh{border-bottom:1px solid var(--border)}
.vgh:not([disabled]):hover{background:var(--g100)}
.vgh .cv{flex:0 0 14px;display:flex;color:var(--g400);padding-top:3px;transition:transform .14s}
.vgroup.op .vgh .cv{transform:rotate(90deg)}
.vgh .ic{flex:0 0 17px;color:var(--g600);padding-top:1px}
.vgh .bd{flex:1;min-width:0}
.vgh .t{display:block;font:500 13.5px/20px var(--font)}
.vgh .q{display:block;font:400 12px/18px var(--font);color:var(--tt);margin-top:1px}
.vgh .ct{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;
  border:1px solid var(--border);background:var(--surface);font:500 12px/18px var(--font)}
.vchk{border-bottom:1px solid var(--border);transition:background .12s}
.vchk:last-child{border-bottom:none}
.vchk:hover{background:var(--g50)}
.vchk.stat:hover{background:none}
.vct{display:grid;grid-template-columns:18px 1fr auto;gap:0 11px;align-items:center;width:100%;padding:13px 14px 5px}
.vct.cl{grid-template-columns:18px 1fr auto 13px}
.vct .ic{grid-row:1;color:var(--g500);display:flex;align-items:center;justify-content:center;height:20px}
.vct .t{grid-row:1;font:500 13.5px/20px var(--font);min-width:0}
.vct .rt{grid-row:1;justify-self:end}
.vct .cv{grid-row:1;color:var(--g400);display:flex;align-items:center;transition:transform .15s}
.vchk.op .vct .cv{transform:rotate(90deg)}
.vbd{padding:0 14px 13px 43px}
.vchk:not(.op) .vbd{display:none}
.vchk:not(.op) .vct{padding-bottom:13px}
.vst{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;white-space:nowrap;
 font:500 12px/18px var(--font);background:var(--gr50);color:var(--gr700)}
.vst.review{background:var(--o50);color:var(--o700)}
.vst.blocked{background:var(--r50);color:var(--r700)}
.vst.pending{background:var(--g100);color:var(--g600)}
.vst.info{background:var(--b50);color:var(--b700)}
.vst.done{background:var(--tl50);color:var(--tl700)}
.vfind{font:400 14px/20px var(--font);color:var(--ts);margin:3px 0 0}
.vprov{font:400 12px/18px var(--font);color:var(--g400);margin:4px 0 0}
.ev{margin:11px 0 0}
.ev:empty{display:none}
.allp{font:400 12.5px/18px var(--font);color:var(--tt);margin:0 0 8px}

/* evidence blocks */
.rowset{margin-bottom:11px}
.rowset:last-child{margin-bottom:0}
.rowset > h5{margin:0 0 3px;font:500 10.5px/16px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--g500)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--g100);font:400 12.5px/19px var(--font)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tt);flex:0 0 auto}
.kv .v{text-align:right;min-width:0;overflow-wrap:anywhere}
.kv.lng{display:block}
.kv.lng .k{display:block}
.kv.lng .v{display:block;text-align:left;margin-top:3px;color:var(--ts)}
.kv .v .chip{margin-left:9px;vertical-align:1px}
.kv .v .del{color:var(--r700);text-decoration:line-through}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.th{width:calc(50% - 5px);max-width:148px}
.th .im{width:100%;height:78px;border-radius:7px;border:2px solid var(--border);overflow:hidden;background:var(--g100);display:block;position:relative}
.th:hover .im{border-color:var(--accent)}
.th .im.ok{border-color:var(--gr600)}.th .im.err{border-color:var(--r600)}.th .im.ref{border-color:var(--b600)}
.th .cp{display:block;font:500 11.5px/17px var(--font);margin-top:6px}
.th .cs{display:block;font:400 11px/16px var(--font);color:var(--g400)}
.bdg{position:absolute;right:5px;top:5px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff}
.bdg.ok{background:var(--gr600)}.bdg.err{background:var(--r600)}
.cmp{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.cmp .sd{flex:1;min-width:0;text-align:center}
.cmp .sd .im{display:block;height:88px;border-radius:8px;overflow:hidden;border:2px solid var(--border)}
.cmp .sd .im.ok{border-color:var(--gr600)}.cmp .sd .im.err{border-color:var(--r600)}.cmp .sd .im.ref{border-color:var(--b600)}
.cmp .sd b{display:block;font:500 11.5px/17px var(--font);margin-top:5px}
.cmp .sd span{display:block;font:400 11px/16px var(--font);color:var(--g400)}
.cmp .vs{flex:0 0 auto;font:500 10px/14px var(--font);color:var(--g400)}
.atr{padding:8px 0;border-bottom:1px solid var(--g100)}
.atr:last-child{border-bottom:none}
.atr .tp{display:flex;align-items:center;gap:9px}
.atr .n{flex:1;font:500 12.5px/19px var(--font)}
.atr .w{font:400 11.5px/17px var(--font);color:var(--g400)}
.atr .why{display:block;font:400 12px/18px var(--font);color:var(--ts);margin-top:2px}
.accr{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--g100)}
.accr:last-child{border-bottom:none}
.accr .n{flex:1;font:400 12.5px/19px var(--font)}
.sq{width:30px;height:30px;border-radius:7px;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;color:var(--g500)}
.sq.no:hover{border-color:var(--r600);color:var(--r700);background:var(--r50)}
.sq.yes:hover{border-color:var(--gr600);color:var(--gr700);background:var(--gr50)}
.sq.edit{border-color:transparent;color:var(--g400);width:24px;height:24px}
.sq.edit:hover{background:var(--g100);color:var(--accent)}
.scoreb{display:flex;align-items:baseline;gap:11px;margin-bottom:11px}
.scoreb .n{font:400 30px/36px var(--font);font-variant-numeric:tabular-nums}
.scoreb .d{color:var(--tt);font-size:12.5px}

.btn.sec{background:var(--b50);border-color:var(--b200);color:var(--accent)}
.btn.sec:hover{background:var(--b100);border-color:var(--b200)}
.lnkin{color:var(--accent);font:500 12.5px/19px var(--font)}
.lnkin:hover{text-decoration:underline}
.lead{margin:0 0 14px;font:400 14px/22px var(--font)}
.lead b{font-weight:500}
.lead .q{color:var(--tt)}

/* verity screen */
.vhead{display:flex;gap:14px;align-items:flex-start;padding:16px 16px 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#FFFDFA 0%,var(--surface) 100%)}
.gauge{flex:0 0 132px;text-align:center;position:relative}
.gauge .lb{position:absolute;left:0;right:0;top:44px}
.gauge .l1{display:block;font:400 12px/18px var(--font);color:var(--tt)}
.gauge .l2{display:block;font:500 19px/26px var(--font);color:var(--o700)}
.vhx{flex:1;min-width:0;padding-top:10px}
.vhx h2{margin:0 0 4px;font:500 18px/26px var(--font);letter-spacing:-.01em}
.vhx p{margin:0;font:400 13px/19px var(--font);color:var(--tt)}
.vctx{padding:14px 16px 0;font:400 14px/22px var(--font)}
.vctx .mut{color:var(--g400)}
.mxw{padding:14px 16px 4px}
.mxt{width:100%;border-collapse:collapse}
.mxt th{font:400 11.5px/17px var(--font);color:var(--tt);font-weight:400;padding:0 4px 9px;text-align:center}
.mxt th:first-child{text-align:left}
.mxt td{padding:11px 4px;border-top:1px solid var(--border)}
.mxt tr:first-child td{border-top:none}
.mxt .rw{width:46%}
.mxt .rwb{display:block;width:100%;border-radius:7px;padding:3px 6px;margin:-3px -6px;transition:background .12s}
.mxt tr:hover .rwb{background:var(--g100)}
.vban .mxt tr:hover .rwb{background:rgba(17,24,39,.05)}
.mxt .rw b{display:block;font:500 13px/19px var(--font)}
.mxt .rw b.clear{color:var(--gr700)}.mxt .rw b.review{color:var(--o700)}
.mxt .rw b.blocked{color:var(--r700)}.mxt .rw b.noted{color:var(--g700)}
.mxt .rw b.pending{color:var(--g500)}
.mxt .d.pending{background:var(--g200)}
.mxt .rw span{display:block;font:400 11.5px/17px var(--font);color:var(--tt)}
.mxt .cl{text-align:center;position:relative}
.mxt .cl::before{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;border-left:1px dashed var(--g300)}
.mxt .d{display:inline-block;width:11px;height:11px;border-radius:50%;position:relative;z-index:1}
.d.clear{background:var(--gr600)}.d.review{background:var(--o600)}
.d.blocked{background:var(--r600)}.d.noted{background:var(--g600)}

.lg{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.lg:last-child{border-bottom:none}
.lg .dt{flex:0 0 9px;padding-top:6px}
.lg .dt i{width:9px;height:9px;border-radius:50%;display:block}
.lg .bd{flex:1;min-width:0}
.lg .t{display:block;font:400 13px/19px var(--font)}
.lg .t b{font-weight:500}
.lg .m{display:block;font:400 11.5px/17px var(--font);color:var(--g400);margin-top:2px}
.note{padding:11px 13px;border-radius:9px;background:var(--b50);border:1px solid var(--b200);
  font:400 12.5px/19px var(--font);color:var(--b800);margin-bottom:14px}
/* every capture recorded for this candidate */
.ahr{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--g100)}
.ahr:last-child{border-bottom:none}
.ahr .ph{position:relative;flex:0 0 56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid var(--border)}
.ahr .ph.ref{border-color:var(--b600)}.ahr .ph.ok{border-color:var(--gr600)}.ahr .ph.err{border-color:var(--r600)}
.ahr .bd{flex:1;min-width:0}
.ahr .k2{display:block;font:500 13px/19px var(--font)}
.ahr .k2.ref{color:var(--b700)}.ahr .k2.ok{color:var(--gr700)}.ahr .k2.err{color:var(--r700)}
.ahr .k2 span{font-weight:400;color:var(--g400)}
.ahr .e2{display:block;font:400 12px/18px var(--font);color:var(--ts);margin-top:1px}
.ahr .w2{display:block;font:400 12px/18px var(--font);color:var(--g400)}
.viewim{width:100%;border-radius:10px;border:1px solid var(--border);overflow:hidden;display:block;margin-bottom:8px;background:var(--g100)}
.viewlb{font:400 13px/20px var(--font);margin:0 0 8px}

/* ---------- a step is one card holding its sub-cards ---------- */
.gin{display:flex;flex-direction:column;gap:8px}

/* ---------- the enrolment step, weighted ---------- */
/* the enrolment is one card: what needs you sits inside it, not beside it */
.ecard1{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
.ebody{padding:4px 14px 13px}
.eatt{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;
 border-bottom:1px solid var(--o300);background:var(--o50)}
.eatt.bad{border-bottom-color:var(--r300);background:var(--r50)}
.eatt.inf{border-bottom-color:var(--b200);background:var(--b50)}
.eatt.ok{border-bottom-color:var(--gr300);background:var(--gr50)}
.eatt.ok .i{color:var(--gr600)}
.eatt.ok .t{color:var(--gr700)}
.eatt .i{flex:0 0 16px;display:flex;color:var(--o600);padding-top:1px}
.eatt.bad .i{color:var(--r600)}
.eatt.inf .i{color:var(--b600)}
.eatt .bd{flex:1;min-width:0}
.eatt .t{display:block;font:500 13.5px/20px var(--font);color:var(--o700)}
.eatt.bad .t{color:var(--r700)}
.eatt.inf .t{color:var(--b800)}
.eatt .go2w{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px}
.eatt .go2{flex:0 0 auto;display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:8px;
 background:var(--b700);color:#fff;font:500 13px/20px var(--font);transition:background .12s}
.eatt .go2:hover{background:var(--b800)}
.eatt .go2.gh{background:var(--surface);color:var(--tp);border:1px solid var(--bd2)}
.eatt .go2.gh:hover{background:var(--g50);border-color:var(--g400)}
.efl{display:flex;flex-wrap:wrap;gap:0 24px}
.ecell{display:block;min-width:124px;flex:1 1 auto;padding:10px 8px 10px 8px;margin:0 -8px;border-radius:9px;
 transition:background .12s}
.ecell:not(.st):hover{background:var(--g50)}
.ecell:not(.st){cursor:pointer}
.ecell .lab{display:block;font:400 11px/16px var(--font);color:var(--g400)}
.ecell .amt{display:block;font:400 23px/30px var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ecell .v{display:block;font:500 14px/22px var(--font)}
.ecell .sub{display:block;font:400 11.5px/17px var(--font);color:var(--tt);margin-top:1px}
.ecell .sub.go{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-weight:500}
.ecell .sub.go svg{display:block;flex:0 0 auto}
.ecell:not(.cand){flex:1 1 calc(50% - 12px)}
.ecell.cand{flex:1 1 calc(50% - 12px);display:flex;align-items:flex-start;gap:12px}
.ecell.cand .bd3{flex:1;min-width:0}
.pairs{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:3px}
.pr2{min-width:0}
.k3{display:block;font:400 10.5px/15px var(--font);color:var(--g400)}
.pr2 .v{display:block}
.iconb{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
 width:30px;height:30px;border-radius:8px;background:none;color:var(--tp);
 transition:background .12s,color .12s}
.iconb svg{display:block}
.iconb.sm{width:22px;height:22px;border-radius:6px}
.labrow{display:inline-flex;align-items:center;gap:1px}
.ecell.cand:hover .iconb,.vban:hover .iconb{background:var(--g100)}
.eft{margin-top:10px;padding-top:11px;border-top:1px solid var(--g100)}
.tickline{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 12.5px/19px var(--font);color:var(--tt)}
.tickline span,.tickline button{display:inline-flex;align-items:center;gap:7px}
.tickline button{color:var(--ts);border-radius:7px;padding:3px 7px;margin:-3px -7px;transition:background .12s}
.tickline button:hover{background:var(--g100);color:var(--tp)}
.tickline i.ty{display:flex;color:var(--g500);flex:0 0 auto}
.tickline i.tk{display:flex;color:var(--gr600);flex:0 0 auto}
.tickline i.tk.bad{color:var(--r600)}
.tickline i.ty.off{color:var(--g300)}
.tickline button:hover i.ty{color:var(--ts)}
.scard{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;
 cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s}
.scard:hover{background:var(--g50);border-color:var(--bd2);box-shadow:var(--sh)}
.scard:hover .sb .th .im{border-color:var(--bd2)}
.scard>.hd{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px}
.scard>.hd .ic{display:flex;color:var(--g500);flex:0 0 16px}
.scard>.hd h5{margin:0;flex:1;min-width:0;font:500 13px/20px var(--font)}
.scard .sb{padding:0 12px 12px}
.scard .sb .rowset>h5{display:none}
.scard .sb .rowset{margin-bottom:0}
.scard .sb .thumbs{margin:0}
.scard .sb .th{width:calc(33.33% - 7px);max-width:104px}
.scard .sb .th .im{height:58px}
.sline{font:400 13px/20px var(--font);color:var(--ts);margin:0 0 9px}
.sline:last-child{margin-bottom:0}
.sline b{font-weight:500;color:var(--tp)}
.samt{display:flex;align-items:baseline;gap:10px;margin:0}
.samt .n{font:400 22px/28px var(--font);font-variant-numeric:tabular-nums}
.samt .d{font:400 12.5px/19px var(--font);color:var(--tt)}
.samt .p{margin-left:auto;align-self:center}
.srow{display:flex;align-items:center;gap:12px;margin:0}
.srow .sline{flex:1;min-width:0;margin:0}
.slink{display:inline-flex;align-items:center;gap:5px;font:500 13px/20px var(--font);color:var(--accent);white-space:nowrap}
.slink svg{display:block}
.slink:hover{text-decoration:underline}
.samt .pm{display:inline-flex;align-items:center;gap:7px;font:400 12.5px/19px var(--font);color:var(--tt)}
.samt .pm svg{display:block}

/* ---------- a step opens into cards, in place ---------- */
.ecards{display:flex;flex-direction:column;gap:11px;padding:4px 0 6px}
.ecard{border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--surface)}
.ecard>header{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);
 background:var(--nested)}
.ecard>header .ic{display:flex;color:var(--g500);flex:0 0 16px}
.ecard>header h4{margin:0;flex:1;min-width:0;font:500 13px/20px var(--font)}
.ecard .eb{padding:12px 13px}
.efind{margin:0;font:400 14px/20px var(--font);color:var(--ts)}
.efind+*{margin-top:11px}
.eopen{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:500 13px/20px var(--font);color:var(--accent)}
.eopen:hover{text-decoration:underline}
.ecard .rowset>h5{display:none}
.ecard .rowset{margin-bottom:0}
.ecard .kv:first-child{padding-top:0}
.ecard .thumbs,.ecard .cmp,.ecard .tries,.ecard .scoreb{margin-bottom:0}
/* the Verity banner: the report's cover, and the way in */
.vban{display:block;width:100%;border:1px solid var(--border);border-radius:12px;cursor:pointer;
 background:var(--surface);transition:border-color .13s,box-shadow .13s}
.vban .mxw{padding:4px 16px 10px}
.vban .mxt td{padding:9px 4px}
.vban .mxt th{padding:0 4px 7px}
.vban .top{border-radius:11px 11px 0 0}
.vban:hover{border-color:var(--bd2);box-shadow:var(--sh)}
.vban .top{display:flex;gap:14px;align-items:center;padding:14px 14px 14px 16px;position:relative;overflow:hidden}
.vban .top .iconb{align-self:flex-start;z-index:2}
.vban.clear .top{background:linear-gradient(105deg,#F2FBF5 0%,#FFFFFF 62%)}
.vban.review .top{background:linear-gradient(105deg,#FFF6EE 0%,#FFFFFF 62%)}
.vban.blocked .top{background:linear-gradient(105deg,#FEF3F2 0%,#FFFFFF 62%)}
.vban.info .top{background:linear-gradient(105deg,#EFF6FF 0%,#FFFFFF 62%)}
.vban.pending .top{background:var(--nested)}
.vban .top::after{content:"";position:absolute;right:-42px;top:-56px;width:150px;height:150px;border-radius:50%;
 border:26px solid rgba(17,24,39,.035)}
.vban .gs{flex:0 0 96px;text-align:center;position:relative;z-index:1}
.vban .gs .lb{position:absolute;left:0;right:0;top:29px}
.vban .gs .l1{display:block;font:400 11px/16px var(--font);color:var(--tt)}
.vban .gs .l2{display:block;font:500 15px/21px var(--font)}
.vban .tx{flex:1;min-width:0;z-index:1}
.vban .tx h4{margin:0;font:500 15px/21px var(--font);letter-spacing:-.01em}
.vban .tx p{margin:5px 0 0;font:400 13px/19px var(--font);color:var(--tt)}
.vban .segs{display:flex;gap:5px;padding:2px 16px 14px}
.vban .segs .sg{position:relative;flex:1;padding:6px 0;border-radius:5px;display:block;min-width:0}
.vban .segs .sg:hover i{filter:brightness(.9)}
.vban .segs .sg i{display:block;height:5px;border-radius:3px;background:var(--g200)}
.vban .segs .sg i.clear{background:var(--gr600)}.vban .segs .sg i.review{background:var(--o600)}
.vban .segs .sg i.blocked{background:var(--r600)}.vban .segs .sg i.noted{background:var(--g400)}
.vban .segs .sg .tip{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);
 background:var(--g900);color:#fff;padding:5px 9px;border-radius:6px;font:400 11.5px/16px var(--font);
 white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:4}
.vban .segs .sg:first-child .tip{left:0;transform:none}
.vban .segs .sg:last-child .tip{left:auto;right:0;transform:none}
.vban .segs .sg:hover .tip{opacity:1}
.vplace{display:flex;gap:11px;align-items:flex-start;border:1px dashed var(--bd2);border-radius:12px;
 padding:14px 15px;background:var(--nested);color:var(--g400)}
.vplace .ic{flex:0 0 17px;display:flex;padding-top:2px}
.vplace .t{display:block;font:500 13.5px/20px var(--font);color:var(--g500)}
.vplace .m{display:block;font:400 12.5px/19px var(--font);margin-top:1px}

/* Verity, embedded at the top of the assessment step */
.vcard{display:flex;gap:14px;align-items:center}
.vcard .gs{flex:0 0 104px;text-align:center;position:relative}
.vcard .gs .lb{position:absolute;left:0;right:0;top:32px}
.vcard .gs .l1{display:block;font:400 11.5px/17px var(--font);color:var(--tt)}
.vcard .gs .l2{display:block;font:500 15px/21px var(--font)}
.vcard .vh{margin:0;flex:1;min-width:0;font:500 14px/20px var(--font)}
.ecard .mxw{padding:12px 0 0}

/* ---------- a component's own screen ---------- */
.tfind{font:400 14px/20px var(--font);color:var(--ts);margin:4px 0 0}
.tflag{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:9px 11px;border-radius:8px;
 font:400 14px/20px var(--font);border:1px solid var(--o300);background:var(--o50);color:var(--o700)}
.tflag.blocked{border-color:var(--r300);background:var(--r50);color:var(--r700)}
.tflag .ic{flex:0 0 15px;display:flex;padding-top:2px}
.tcard{border:1px solid var(--border);border-radius:10px;margin-top:11px;overflow:hidden;background:var(--surface)}
.tcard>h4{margin:0;padding:9px 13px;background:var(--nested);border-bottom:1px solid var(--border);
 font:500 12px/18px var(--font);color:var(--g700)}
.tcard>.in{padding:3px 13px 9px}
.tcard .rowset>h5{display:none}
.tcard .rowset{margin-bottom:0}
.tcard .thumbs,.tcard .cmp,.tcard .tries,.tcard .scoreb{margin:10px 0 4px}
.tjump{margin-top:11px}

/* reason picker */
.flab{display:block;font:500 12.5px/19px var(--font);margin-top:16px}
.rsn{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:12px}
.rr{display:flex;gap:11px;align-items:flex-start;width:100%;padding:12px 13px;border-bottom:1px solid var(--g100);
 transition:background .12s}
.rr:last-child{border-bottom:none}
.rr:hover{background:var(--g50)}
.rr .rd{flex:0 0 16px;height:16px;margin-top:2px;border:1px solid var(--bd2);border-radius:50%;display:grid;place-items:center}
.rr.on .rd{border-color:var(--accent);border-width:5px}
.rr .bd2{flex:1;min-width:0}
.rr .nm2{display:block;font:400 13.5px/20px var(--font)}
.rr .ds{display:block;font:400 12px/18px var(--font);color:var(--tt);margin-top:1px}
.ta{width:100%;min-height:74px;padding:9px 11px;border:1px solid var(--bd2);border-radius:9px;resize:vertical;
 font:400 13.5px/20px var(--font);color:var(--tp);background:var(--surface);margin-top:10px}
.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--b50)}

/* ---------- accommodation catalogue: the whole of it, on screen ---------- */
.picksum{font:400 13px/20px var(--font);color:var(--tt);margin:0}
.opt{font-weight:400;color:var(--g400)}
.acat{display:block;font:500 10.5px/16px var(--font);letter-spacing:.09em;text-transform:uppercase;
 color:var(--g500);margin-top:19px}
.aopt{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-top:8px;
 overflow:hidden;transition:border-color .12s,background .12s}
.aopt.on{border-color:var(--b200);background:var(--b50)}
.arow{display:flex;gap:11px;align-items:flex-start;width:100%;padding:12px 13px;transition:background .12s}
.aopt:not(.on) .arow:hover{background:var(--g50)}
.abx{flex:0 0 17px;height:17px;margin-top:2px;border:1px solid var(--bd2);border-radius:4px;
 display:grid;place-items:center;color:#fff;background:var(--surface)}
.abx.on{background:var(--accent);border-color:var(--accent)}
.abx svg{width:12px;height:12px}
.abx.sm{flex:0 0 16px;height:16px;margin-top:0}
.aic{flex:0 0 16px;display:flex;color:var(--g500);padding-top:3px}
.aopt.on .aic{color:var(--accent)}
.arow .bd{flex:1;min-width:0}
.arow .t{display:block;font:500 13.5px/20px var(--font)}
.aopt.on .arow .t{color:var(--b800)}
.arow .d{display:block;font:400 12.5px/19px var(--font);color:var(--tt);margin-top:1px}
.akids{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:0 13px 11px 54px}
.akid{display:inline-flex;align-items:center;gap:10px;padding:5px 8px;margin-left:-8px;border-radius:7px;
 transition:background .12s}
.akid:hover{background:rgba(29,78,216,.08)}
.akid .kt{font:400 13px/20px var(--font);color:var(--ts)}
.akid.on .kt{color:var(--accent);font-weight:500}
.ardo{flex:0 0 16px;height:16px;border:1px solid var(--bd2);border-radius:50%;background:var(--surface)}
.ardo.on{border-color:var(--accent);border-width:5px}
.tilegrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px}
.tile{flex:0 0 calc(25% - 7.5px);min-width:0;min-height:78px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:7px;padding:11px 7px;border:1px solid var(--border);
 border-radius:10px;background:var(--surface);text-align:center;
 transition:border-color .12s,background .12s,color .12s}
.tile:hover{border-color:var(--bd2);background:var(--g50)}
.tile .ic{display:flex;color:var(--g500)}
.tile .tl{font:500 12px/16px var(--font);color:var(--ts);overflow-wrap:anywhere}
.tile.on{border-color:var(--gr300);background:var(--gr50)}
.tile.on .ic,.tile.on .tl{color:var(--gr700)}
.tile.on:hover{background:#E4FBEA}
.gsub{display:block;font:400 11.5px/17px var(--font);color:var(--tt);margin-top:13px}
.tcard .in > .gsub:first-child{margin-top:4px}
.tilegrid.ro .tile{cursor:pointer}
.tilegrid.ro .tile:hover{background:var(--gr50)}
/* Tessera editable data: a label, then the value itself — no box until you touch it */
.edt{display:block;width:100%;margin-top:2px;padding:5px 7px;border:none;border-radius:6px;background:none;
 font:400 14px/22px var(--font);color:var(--tp);appearance:none;-webkit-appearance:none}
.edt:hover{background:var(--g100)}
.edt:focus{outline:none;background:var(--g100);box-shadow:inset 0 -2px 0 var(--accent)}

/* one source of truth: the accommodation list drives the section, the stage status and the summary */
function accSync(){
 const c=C(), A=ACCS[c.id]||[], en=c.steps.enrollment;
 if(!en.base) en.base={k:en.k,chip:en.chip.slice(),sum:en.sum};
 const pend=A.filter(a=>!a.s).length, ap=A.filter(a=>a.s==='y');
 let ch=en.checks.find(x=>x.t==='Accommodations');
 if(!A.length){ if(ch) en.checks.splice(en.checks.indexOf(ch),1); }
 else{
  if(!ch){
   ch=CHK('clock','Accommodations',['','pending'],'','Added by a coordinator',[],en.meta);
   ch.synth=true;
   const at=en.checks.findIndex(x=>x.t==='Payment');
   en.checks.splice(at<0?en.checks.length:at,0,ch);
  }
  ch.ev=[ACC()];
  if(pend){ch.chip=['Pending approval','review'];
   ch.find=(NUM[pend]||pend)+' request'+(pend>1?'s are':' is')+' pending approval. The candidate cannot be scheduled until '+(pend>1?'each one is':'it is')+' decided.';}
  else if(ap.length){ch.chip=['Approved','clear'];
   ch.find=AND(ap.map(a=>a.n))+(ap.length>1?' are':' is')+' approved and applied to the booking.';}
  else{ch.chip=['Declined','pending'];
   ch.find='Every request was declined. The candidate sits under standard conditions.';}
 }
 if(pend&&en.base.k!=='blocked'){en.k='review';en.chip=['Pending approval','review'];}
 else{en.k=en.base.k;en.chip=en.base.chip.slice();}
 let extra='';
 if(pend) extra=(NUM[pend]||pend)+' accommodation request'+(pend>1?'s':'')+' need'+(pend>1?'':'s')+' your decision.';
 else if(accTouched[c.id]&&ap.length){
  const shut=['Rejected','Cancelled','Completed'].indexOf(c.status[0])>-1;
  extra=AND(ap.map(a=>a.n))+(ap.length>1?' are':' is')+(shut?' on file.':' applied to the booking.');}
 en.sum=extra?END(en.base.sum)+' '+extra:END(en.base.sum);
}

}
let toastUndo=null;
function flash(m,undo){toast=m;toastUndo=undo||null;render();clearTimeout(flash.t);
 flash.t=setTimeout(()=>{toast=null;toastUndo=null;render();},undo?6000:1900);}
function closeMenu(){document.querySelectorAll('.menu').forEach(m=>m.remove());}
document.addEventListener('click',e=>{
 const mi=e.target.closest('[data-mi]');
 if(mi){if(mi.disabled)return;const t=mi.dataset.mi;closeMenu();
   if(t==='Re-enroll'){stack.push('reenroll');render();return;}
   if(t==='Add accommodation'){accPick={};accExp={};accWhy='';accNote2='';accDoc=null;
     stack.push('addacc');render();return;}
   if(t==='Reject enrollment'){rsnSel=null;rsnNote='';stack.push('reject');render();return;}
   const snap=t==='Approve enrollment'?{i:ci,c:JSON.stringify(CANDS[ci]),a:JSON.stringify(ACCS[C().id]||[])}:null;
   const msg=doAction(t);
   if(t==='Reattempt') stack=[];
   flash(msg,snap);return;}
 if(e.target.closest('[data-undo]')&&toastUndo){const u=toastUndo;
   CANDS[u.i]=JSON.parse(u.c);ACCS[CANDS[u.i].id]=JSON.parse(u.a);flash('Approval undone \u00b7 nothing was sent to '+CANDS[u.i].n.split(' ')[0]);return;}
 if(!e.target.closest('.menu'))closeMenu();
 if(e.target.closest('[data-noop]')){e.preventDefault();return;}
 const op=e.target.closest('[data-open]');
 if(op){ci=parseInt(op.dataset.open);open=true;stack=[];render();return;}
 if(e.target.closest('[data-close]')){open=false;stack=[];render();return;}
 if(e.target.closest('[data-back]')){certModal=false;stack.pop();render();return;}
 const cn=e.target.closest('[data-cand]');
 if(cn){ci=(ci+parseInt(cn.dataset.cand)+CANDS.length)%CANDS.length;stack=[];render();flash('Showing '+C().n);return;}
 const gd=e.target.closest('[data-godetail]');
 if(gd){stack.push('step:'+gd.dataset.godetail);render();return;}
 if(e.target.closest('[data-accopen]')&&!e.target.closest('[data-accset],[data-accclr],[data-noop]')){
   stack.push('accmanage');render();return;}
 if(e.target.closest('[data-mi2]')){accPick={};accExp={};accWhy='';accNote2='';accDoc=null;
   stack.push('addacc');render();return;}
 const ed=e.target.closest('[data-edet]');
 if(ed&&!e.target.closest('[data-view],[data-accset],[data-accclr],[data-jump],[data-att],[data-goscr],[data-act3]')){
   stack.push('det:'+ed.dataset.edet);render();return;}
 if(e.target.closest('[data-notify]')){notify=!notify;render();return;}
 const gs=e.target.closest('[data-goscr]');
 if(gs){rsnSel=null;rsnNote='';stack.push(gs.dataset.goscr);render();return;}
 const rs=e.target.closest('[data-rsn]');
 if(rs){rsnSel=+rs.dataset.rsn;render();return;}
 if(e.target.closest('[data-rsnapply]')){
  const m=doAction('Override ID verification');stack.pop();rsnSel=null;rsnNote='';flash(m);return;}
 if(e.target.closest('[data-rejapply]')){
  const m=doAction('Reject enrollment');stack=[];rsnSel=null;rsnNote='';flash(m);return;}
 if(e.target.closest('[data-relapply]')){
  const m=doAction('Publish score');stack.pop();rsnSel=null;rsnNote='';flash(m);return;}
 if(e.target.closest('[data-idvagain]')){flash(doAction('Request identity documents again'));return;}
 const amn=e.target.closest('[data-attmenu]');
 if(amn){closeMenu();const st2=SD(amn.dataset.attmenu), cur=attIdx(st2);
  const d=document.createElement('div');d.className='menu';
  d.innerHTML=st2.att.map((a,i)=>`<button data-att="${i}" ${i===cur?'style="background:var(--g100);color:var(--tp)"':''}>
    ${E(a.t)} &middot; ${E(a.when)}</button>`).join('');
  document.body.appendChild(d);
  const r=amn.getBoundingClientRect();
  d.style.top=Math.min(r.bottom+6,innerHeight-d.offsetHeight-10)+'px';
  d.style.left=Math.max(10,r.right-d.offsetWidth)+'px';return;}
 const atb=e.target.closest('[data-att]');
 if(atb){closeMenu();stack=[];render();return;}
 const ax=e.target.closest('[data-aexp]');
 if(ax){const t=ax.dataset.aexp;
  if(accExp[t]){delete accExp[t];
   (ACAT.reduce((a,g)=>a.concat(g[1]),[]).find(o=>o.t===t)||{kids:[]}).kids
     .forEach(k=>delete accPick[k[0]]);}
  else accExp[t]=true;
  render();return;}
 const ap=e.target.closest('[data-accpick]');
 if(ap){const k=ap.dataset.accpick, on=!accPick[k];
  if(on&&AONE[k]) Object.keys(AONE).forEach(o=>{if(AONE[o]===AONE[k]&&o!==k) delete accPick[o];});
  if(on) accPick[k]=true; else delete accPick[k];
  render();return;}
 if(e.target.closest('[data-adoc]')){accDoc='Medical-note.pdf \u00b7 242 KB';render();return;}
 if(e.target.closest('[data-adocrm]')){accDoc=null;render();return;}
 const apm=e.target.closest('[data-aperm]');
 if(apm){accPerm=apm.dataset.aperm;render();return;}
 if(e.target.closest('[data-accadd]')){
   const picked=Object.keys(accPick).filter(k=>accPick[k]);
   if(!picked.length)return;
   const why=accWhy==='Other'?accNote2.trim():accWhy;
   picked.forEach(n2=>ACCS[C().id].push({n:n2,ic:AICO[n2]||'clock',s:'y',on:TODAY,why:why,
     src:'Added by Divya K. \u00b7 '+why,doc:accDoc,issuer:accDoc?accIss.trim():'',issued:accDoc?accIssOn.trim():'',
     perm:accDoc?accPerm:''}));
   accIss='';accIssOn='';accPerm='Yes';
   accTouched[C().id]=true;
   accPick={};accExp={};accWhy='';accNote2='';accDoc=null;
   stack.pop();render();
   flash(picked.length+' accommodation'+(picked.length>1?'s':'')+' added');return;}
 const ck=e.target.closest('[data-chk]');
 if(ck){const k=ck.dataset.chk;openChk[k]=!(k in openChk?openChk[k]:ck.closest('.vchk').classList.contains('op'));render();return;}
 const gp=e.target.closest('[data-grp]');
 if(gp){const k=gp.dataset.grp;openGrp[k]=!(k in openGrp?openGrp[k]:gp.closest('.vgroup').classList.contains('op'));render();return;}
 const vg=e.target.closest('[data-vgo]');
 if(vg){const t=vg.dataset.vgo;
  openGrp[C().id+'|'+t]=true;
  if(stack[stack.length-1]!=='verity') stack.push('verity');
  pendGrp='vg-'+t.replace(/[^a-z0-9]/gi,'-').toLowerCase();
  render();return;}
 const jp=e.target.closest('[data-jump]');
 if(jp){stack.push(jp.dataset.jump);render();return;}
 const vw=e.target.closest('[data-view]');
 if(vw){stack.push('view:'+vw.dataset.view);render();return;}
 if(e.target.closest('[data-golog]')){stack.push('log');render();return;}
 const as=e.target.closest('[data-accset]');
 if(as){const [i,v]=as.dataset.accset.split('|');const c=C();
   ACCS[c.id][+i].s=v;accTouched[c.id]=true;
   let msg=ACCS[c.id][+i].n+(v==='y'?' approved':' declined');
   if(ACCS[c.id].every(a=>a.s)&&c.status[0]==='Pending Approval') msg+=' \u00b7 the enrollment still needs your decision';
   render();flash(msg);return;}
 const ac=e.target.closest('[data-accclr]');
 if(ac){ACCS[C().id][+ac.dataset.accclr].s=null;render();flash('Decision cleared');return;}
 const mn=e.target.closest('[data-menu]');
 if(mn){closeMenu();
  const d=document.createElement('div');d.className='menu';
  d.innerHTML=menuItems().map(t=>`<button data-mi="${E(t)}">${E(t)}</button>`).join('');
  document.body.appendChild(d);
  const r=mn.getBoundingClientRect();
  d.style.top=Math.min(r.bottom+6,innerHeight-d.offsetHeight-10)+'px';
  d.style.left=Math.max(10,r.right-d.offsetWidth)+'px';return;}
 const cc=e.target.closest('[data-certclose]');
 if(cc&&(!e.target.closest('.cmbox')||e.target.closest('.cmx'))){certModal=false;render();return;}
 const cv=e.target.closest('[data-certview]');
 if(cv&&!e.target.closest('[data-act3]')){certModal=true;render();return;}
 const a3=e.target.closest('[data-act3]');
 if(a3){flash(doAction(a3.dataset.act3));return;}
 const cm=e.target.closest('[data-certmore]');
 if(cm){closeMenu();const d=document.createElement('div');d.className='menu';
  d.innerHTML=['Reissue with corrections','Change expiry date','Revoke credential']
    .map(t=>`<button data-mi="${E(t)}">${E(t)}</button>`).join('');
  document.body.appendChild(d);const r=cm.getBoundingClientRect();
  d.style.top=(r.top<innerHeight/2?r.bottom+6:Math.max(10,r.top-d.offsetHeight-6))+'px';
  d.style.left=Math.max(10,r.right-d.offsetWidth)+'px';return;}
 const a2=e.target.closest('[data-act2]');
 if(a2){const m=doAction(a2.dataset.act2);stack.pop();flash(m);return;}
 const act=e.target.closest('[data-act]');
 if(act){flash(act.dataset.act+' — applied');return;}
});
document.addEventListener('change',e=>{
 const w=e.target.closest('[data-awhy]');
 if(w){accWhy=w.value;accNote2='';render();}
});
document.addEventListener('input',e=>{
 const nt=e.target.closest('[data-rnote]');
 if(nt){rsnNote=nt.value;
  const set=(sel,list)=>{const b=document.querySelector(sel);
    if(b)b.disabled=!(rsnSel!=null&&(list[rsnSel][0]!=='Other'||rsnNote.trim().length>2));};
  set('[data-rsnapply]',RSNS);set('[data-relapply]',RELRSNS);set('[data-rejapply]',REJRSNS);return;}
 const ai=e.target.closest('[data-aiss]'); if(ai){accIss=ai.value;return;}
 const ao=e.target.closest('[data-aisson]'); if(ao){accIssOn=ao.value;return;}
 const an=e.target.closest('[data-anote]');
 if(an){accNote2=an.value;const b=document.querySelector('[data-accadd]');
  if(b)b.disabled=!(Object.keys(accPick).filter(k=>accPick[k]).length&&accNote2.trim().length>2);return;}
});
addEventListener('resize',closeMenu,true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&certModal){certModal=false;render();}
 const cv=e.target.closest&&e.target.closest('[data-certview]');
 if(cv&&(e.key==='Enter'||e.key===' ')&&e.target===cv){e.preventDefault();certModal=true;render();}});
render();
</script>
