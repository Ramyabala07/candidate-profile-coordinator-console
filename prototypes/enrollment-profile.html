<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Exam-First Candidate Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Roboto+Mono:wght@400&display=swap">
<style>
:root{
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;
  --g500:#6B7280;--g600:#4B5563;--g700:#374151;--g800:#1F2937;--g900:#111827;
  --b50:#EFF6FF;--b100:#DBEAFE;--b200:#BFDBFE;--b600:#2563EB;--b700:#1D4ED8;--b800:#1E40AF;
  --r50:#FEF2F2;--r300:#FCA5A5;--r600:#DC2626;--r700:#B91C1C;
  --o50:#FFF7ED;--o300:#FDBA74;--o700:#C2410C;
  --gr50:#F0FDF4;--gr300:#86EFAC;--gr600:#16A34A;--gr700:#15803D;
  --tl50:#F0FDFA;--tl300:#5EEAD4;--tl700:#0F766E;
  --surface:#fff;--border:var(--g200);--bd2:var(--g300);
  --tp:var(--g900);--ts:var(--g700);--tt:var(--g500);--accent:var(--b700);
  --sh:0 1px 2px rgba(17,24,39,.06);
  --shl:0 10px 34px rgba(17,24,39,.14),0 2px 6px rgba(17,24,39,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--g100);color:var(--tp);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.proto{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--g900);color:#fff;position:sticky;top:0;z-index:100}
.proto .ttl{font:500 12px/16px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--g400)}
.proto .seg{display:flex;gap:2px;margin-left:6px;background:rgba(255,255,255,.08);padding:3px;border-radius:7px}
.proto .seg button{padding:5px 14px;border-radius:5px;font:500 12.5px/16px var(--font);color:var(--g300)}
.proto .seg button[aria-pressed="true"]{background:#fff;color:var(--g900)}
.proto .hint{margin-left:auto;font:400 12px/16px var(--font);color:var(--g400)}
.proto .glab{font:500 10.5px/14px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--g500);margin-left:8px}

.app{position:relative;display:flex;height:calc(100vh - 44px);min-height:680px;background:var(--surface);overflow:hidden}
.rail{width:52px;flex:0 0 52px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:14px}
.rail .ic{width:32px;height:32px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--g500)}
.rail .ic.on{background:var(--g100);color:var(--g900)}
.rail .sp{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}

.crumb{display:flex;align-items:center;gap:8px;padding:16px 22px;border-bottom:1px solid var(--border);font:400 15px/22px var(--font);color:var(--tt);flex:0 0 auto}
.crumb b{font-weight:500;color:var(--tp)}
.crumb .sl{color:var(--g300)}
.crumb .bk{display:flex;align-items:center;gap:6px;color:var(--accent);font:500 14px/20px var(--font)}
.crumb .bk:hover{text-decoration:underline}
.tools{display:flex;align-items:center;gap:10px;padding:14px 22px;flex:0 0 auto}
.tabsx{display:flex;gap:2px;border:1px solid var(--border);border-radius:9px;padding:3px}
.tabsx button{padding:6px 13px;border-radius:6px;font:400 13.5px/20px var(--font);color:var(--ts);white-space:nowrap}
.tabsx button.on{color:var(--tp);font-weight:500;box-shadow:var(--sh);border:1px solid var(--border);padding:5px 12px}
.spacer{flex:1}
.srch{display:flex;align-items:center;gap:8px;width:224px;height:36px;padding:0 11px;border:1px solid var(--bd2);border-radius:8px;color:var(--g400)}
.srch input{border:none;outline:none;font:400 13.5px/20px var(--font);width:100%;background:none}
.iconbtn{width:36px;height:36px;border:1px solid var(--bd2);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--g600)}
.iconbtn:hover{background:var(--g50)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:8px;font:500 13.5px/20px var(--font);white-space:nowrap}
.btn.pri{background:var(--b600);color:#fff}.btn.pri:hover{background:var(--b700)}
.btn.sec{border:1px solid var(--bd2);color:var(--ts)}.btn.sec:hover{background:var(--g50)}
.btn.dgr{background:var(--r600);color:#fff}.btn.dgr:hover{background:var(--r700)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:7px}
.kbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--g600);border:1px solid var(--bd2);flex:0 0 30px}
.kbtn:hover{background:var(--g50)}

.tw{flex:1;overflow:auto;border-top:1px solid var(--border)}
table.t{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.t th{font:400 13px/18px var(--font);color:var(--g600);padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:3;white-space:nowrap;text-align:left}
.t td{padding:9px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.t tbody tr:hover td{background:var(--g50)}
.t .c1{position:sticky;left:0;z-index:2;min-width:326px;border-right:1px solid var(--border)}
.t th.c1{z-index:4}
.t tbody tr:hover .c1{background:var(--g50)}
.t tbody tr{cursor:pointer}
.cand{display:flex;align-items:center;gap:10px}
.chev{width:20px;flex:0 0 20px;display:flex;align-items:center;justify-content:center;color:var(--g500);transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.av{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--font);color:#fff}
.nm{font:500 14px/20px var(--font)}
.em{font:400 12px/18px var(--font);color:var(--tt)}
.chn{display:flex;gap:4px;margin-left:4px;color:var(--g400)}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font:400 12.5px/19px var(--font);border:1px solid var(--bd2);color:var(--ts);white-space:nowrap}
.pill.ok{color:var(--gr700);border-color:var(--gr300)}
.pill.err{color:var(--r700);border-color:var(--r300)}
.pill.warn{color:var(--o700);border-color:var(--o300)}
.pill.info{color:var(--b700);border-color:var(--b200)}
.pill.mute{color:var(--g600)}
.pill.teal{color:var(--tl700);border-color:var(--tl300)}
.chip.teal{background:var(--tl50);color:var(--tl700)}
.sub{font:400 12px/18px var(--font);color:var(--tt)}
.money{font-variant-numeric:tabular-nums}
.grn{color:var(--gr700)}.amb{color:var(--o700)}.red{color:var(--r700)}
.oe td{background:var(--g50)}
.oe:hover td{background:var(--g100)}
.oe-h{font:500 13px/18px var(--font);color:var(--g600);padding:8px 16px 8px 46px!important}
.foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:11px 22px;border-top:1px solid var(--border);font:400 13px/20px var(--font);color:var(--ts)}
.foot .box{border:1px solid var(--bd2);border-radius:7px;padding:3px 10px;min-width:44px;text-align:center}

.menu{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shl);padding:6px;min-width:236px;max-width:300px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;font:400 13.5px/20px var(--font);color:var(--ts)}
.menu button:hover{background:var(--g100)}
.menu button.dgr{color:var(--r700)}
.menu .sep{height:1px;background:var(--border);margin:5px 2px}
.menu .lb{font:500 10.5px/14px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--g400);padding:7px 10px 4px}
.amenu button{align-items:flex-start;gap:9px;padding:9px 10px}
.amenu .tk{flex:0 0 16px;color:var(--gr700);padding-top:2px}
.amenu .al{font:500 13.5px/19px var(--font);color:var(--tp);display:block}
.amenu .as{font:400 12px/17px var(--font);color:var(--tt);display:block;margin-top:1px}
.amenu button.on{background:var(--b50)}

.scrim{position:absolute;inset:0;background:rgba(17,24,39,.55);z-index:60;display:flex;justify-content:flex-end}
.drawer{position:relative;width:548px;max-width:calc(100% - 150px);background:var(--surface);height:100%;display:flex;flex-direction:column;box-shadow:var(--shl)}

/* header strip */
.phead{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.phead .av{width:40px;height:40px;flex-basis:40px;font-size:14px}
.phid{min-width:0;flex:1}
.pname{display:flex;align-items:center;gap:7px;font:500 16px/23px var(--font);min-width:0}
.pname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font:400 12px/18px var(--font);color:var(--tt);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta .sl{color:var(--g300);margin:0 5px}
.hact{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.mini{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;border-radius:5px;flex:0 0 21px}
.mini.parent{color:var(--o700);background:var(--o50);border:1px solid var(--o300)}
.mini.acc{color:var(--gr700);background:var(--gr50);border:1px solid var(--gr300)}

/* tab row with attempt selector */
.trow{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.tabs2{display:flex;gap:2px;background:var(--g100);border-radius:8px;padding:3px}
.tabs2 button{padding:5px 13px;border-radius:6px;font:400 13px/19px var(--font);color:var(--ts);white-space:nowrap}
.tabs2 button.on{background:var(--surface);color:var(--tp);font-weight:500;box-shadow:var(--sh)}
.atsel{display:inline-flex;align-items:center;gap:7px;margin-left:auto;padding:5px 9px;border:1px solid var(--bd2);border-radius:8px;font:400 13px/19px var(--font);color:var(--ts);white-space:nowrap}
.atsel:hover{background:var(--g50)}
.atsel b{font-weight:500;color:var(--tp)}
.dotm{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.dotm.g{background:var(--gr600)}.dotm.b{background:var(--b600)}.dotm.r{background:var(--r600)}.dotm.a{background:#F59E0B}.dotm.n{background:var(--g300)}

.pbody{flex:1;overflow-y:auto}
.pinner{padding:14px 16px 26px}

/* stage list — reverse chronological, inline warnings */
.slist{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.srow{display:flex;align-items:flex-start;gap:11px;width:100%;padding:12px 13px;border-bottom:1px solid var(--border);background:var(--surface);transition:background .12s,box-shadow .12s;position:relative}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--g50);box-shadow:inset 3px 0 0 var(--b600)}
.srow:active{background:var(--g100)}
.srow .mk{flex:0 0 16px;display:flex;align-items:center;justify-content:center;padding-top:2px;color:var(--g300)}
.srow .bd{flex:1;min-width:0}
.srow .tt{font:500 13.5px/20px var(--font);display:block}
.srow .vv{font:400 12.5px/18px var(--font);color:var(--tt);display:block;margin-top:1px}
.srow .rt{flex:0 0 auto;padding-top:1px}
.srow.warn{background:var(--o50)}
.srow.warn:hover{background:#FDF0E0;box-shadow:inset 3px 0 0 var(--o700)}
.srow.warn .mk{color:var(--o700)}
.srow.warn .vv{color:var(--o700)}
.srow.err{background:var(--r50)}
.srow.err:hover{background:#FDE8E8;box-shadow:inset 3px 0 0 var(--r600)}
.srow.err .mk{color:var(--r700)}
.srow.err .vv{color:var(--r700)}
.srow.up .tt{color:var(--g600)}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:6px;font:500 12px/18px var(--font);white-space:nowrap}
.chip.ok{background:var(--gr50);color:var(--gr700)}
.chip.err{background:var(--r50);color:var(--r700)}
.chip.warn{background:var(--o50);color:var(--o700)}
.chip.info{background:var(--b50);color:var(--b700)}
.chip.mute{background:var(--g100);color:var(--g600)}
.srow.warn .chip.warn{background:#FBE3CC}
.srow.err .chip.err{background:#FBD9D9}
.glabel{font:500 10.5px/14px var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--g500);margin:18px 0 8px}

/* push screen */
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.shead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex:0 0 auto}
.shead .bk{display:flex;align-items:center;gap:9px;font:500 15px/22px var(--font);color:var(--tp);min-width:0}
.shead .bk .ar{color:var(--g600);flex:0 0 auto}
.shead .bk .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .rt{margin-left:auto;flex:0 0 auto}
.sbody{flex:1;overflow-y:auto;padding:16px}
.ftr{display:flex;align-items:center;gap:9px;padding:11px 16px;border-top:1px solid var(--border);flex:0 0 auto;background:var(--surface)}
.ftr .sp{flex:1}
.ftr .sub{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.verdict{font:400 14px/22px var(--font);margin:0 0 14px}
.verdict b{font-weight:500}
.verdict.ok b{color:var(--gr700)}
.verdict.err b{color:var(--r700)}
.verdict.warn b{color:var(--o700)}

.card{border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:13px}
.card-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--g50);border-bottom:1px solid var(--border);font:500 13px/18px var(--font)}
.card-h .rt{margin-left:auto}
.kv2{display:flex;align-items:flex-start;gap:12px;padding:9px 12px;border-bottom:1px solid var(--border)}
.kv2:last-child{border-bottom:none}
.kv2 .k{font:400 12.5px/19px var(--font);color:var(--tt);flex:0 0 148px}
.kv2.hug .k{flex:0 0 auto;white-space:nowrap;color:var(--tp)}
.kv2.hug .v{text-align:right}
.kv2 .v{font:400 12.5px/19px var(--font);color:var(--tp);flex:1;text-align:right;min-width:0;word-break:break-word}
.kv2 .v .del{color:var(--r700);text-decoration:line-through}
.kv2 .v .mono{font-family:var(--mono);font-size:12px}
.kv2 .c{flex:0 0 auto}
.lnk{color:var(--accent)}
.lnk:hover{text-decoration:underline}

.thumbs{display:flex;gap:11px;padding:12px;flex-wrap:wrap}
.th{width:142px}
.th .im{width:142px;height:92px;border-radius:8px;border:2px solid var(--border);overflow:hidden;background:var(--g100);display:block;position:relative}
.th:hover .im{border-color:var(--accent)}
.th .im.ok{border-color:var(--gr600)}
.th .im.err{border-color:var(--r600)}
.th .im.ref{border-color:var(--b600)}
.th .cp{font:500 12px/17px var(--font);margin-top:6px;display:block}
.th .cs{font:400 11px/15px var(--font);color:var(--tt);display:block}
.badgek{position:absolute;right:5px;top:5px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff}
.badgek.ok{background:var(--gr600)}.badgek.err{background:var(--r600)}

/* authentication history */
.ah{padding:4px 12px 12px}
.ahr{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
.ahr:first-child{border-top:none}
.ahr .ph{position:relative;flex:0 0 72px}
.ahr .ph .im{width:72px;height:72px;border-radius:7px;overflow:hidden;border:2px solid var(--border)}
.ahr .ph .im.ref{border-color:var(--b600)}
.ahr .ph .im.ok{border-color:var(--gr600)}
.ahr .ph .im.err{border-color:var(--r600)}
.ahr .bd2{min-width:0;padding-top:2px}
.ahr .k2{font:500 14px/20px var(--font);display:block}
.ahr .k2.ref{color:var(--b700)}
.ahr .k2.ok{color:var(--gr700)}
.ahr .k2.err{color:var(--r700)}
.ahr .k2 span{font-weight:400;color:var(--g600)}
.ahr .e2{font:400 12.5px/18px var(--font);color:var(--g700);display:block;margin-top:2px}
.ahr .w2{font:400 12px/18px var(--font);color:var(--tt);display:block;font-variant-numeric:tabular-nums}

.tagr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border)}
.tagr:last-child{border-bottom:none}
.tagr .tg{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:7px;background:var(--g50);border:1px solid var(--border);font:400 12.5px/19px var(--font)}
.tagr .rt{margin-left:auto;display:flex;gap:6px;align-items:center}
.accbtns{display:flex;gap:6px}
.accbtn{width:29px;height:29px;border-radius:7px;border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;color:var(--g500)}
.accbtn.yes:hover{background:var(--gr50);border-color:var(--gr300);color:var(--gr700)}
.accbtn.no:hover{background:var(--r50);border-color:var(--r300);color:var(--r700)}
.accbtn.edit{width:26px;height:26px;border-color:transparent;color:var(--g400)}
.accbtn.edit:hover{background:var(--g100);color:var(--accent)}
.accstate{font:500 12.5px/19px var(--font)}
.accstate.ap{color:var(--gr700)}
.accstate.rj{color:var(--g500)}

.scoreb{display:flex;align-items:baseline;gap:11px;padding:13px 12px}
.scoreb .n{font:400 28px/34px var(--font);font-variant-numeric:tabular-nums}
.scoreb .d{color:var(--tt);font-size:12.5px}
.scoreb .p{margin-left:auto;align-self:center}

.viewim{width:100%;border-radius:10px;border:1px solid var(--border);overflow:hidden;display:block;margin-bottom:8px;background:var(--g100)}
.viewlb{font:400 13px/20px var(--font);margin:0 0 8px}
.pair{display:flex;gap:14px;flex-wrap:wrap}
.pair .it{width:230px}
.pair .it .im{width:230px;height:170px;border-radius:9px;border:2px solid var(--border);overflow:hidden;background:var(--g100);position:relative}
.pair .it .im.ok{border-color:var(--gr600)}
.pair .it .im.ref{border-color:var(--b600)}
.pair .it .cp{font:500 12.5px/19px var(--font);margin-top:8px;display:block}
.pair .it .cs{font:400 11.5px/17px var(--font);color:var(--tt);display:block}

/* timeline */
.tl{padding-left:2px}
.ms{position:relative;padding-left:26px;padding-bottom:18px}
.ms:last-child{padding-bottom:2px}
.ms:not(:last-child)::before{content:"";position:absolute;left:5px;top:12px;bottom:-8px;width:2px;background:var(--border)}
.ms .dt{position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 3px var(--surface)}
.dt.g{background:var(--gr600)}.dt.b{background:var(--b600)}.dt.r{background:var(--r600)}.dt.a{background:#F59E0B}.dt.n{background:var(--g300)}
.ms .hd{font:400 13.5px/21px var(--font);color:var(--ts)}
.ms .hd b{font-weight:500;color:var(--tp)}
.ms .hd .sl{color:var(--g300);margin:0 3px}
.ms .sb2{font:400 12px/18px var(--font);color:var(--tt);margin-top:1px}
.ghost{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:3px 9px;border:1px solid var(--bd2);border-radius:7px;font:500 11.5px/18px var(--font);color:var(--ts)}
.ghost:hover{background:var(--g50)}

.fld{margin-bottom:14px}
.fld .lb{display:block;font:500 12.5px/19px var(--font);margin-bottom:6px}
.fld .hp{display:block;font:400 11.5px/17px var(--font);color:var(--tt);margin-top:5px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--bd2);border-radius:8px;padding:8px 10px;font:400 13px/20px var(--font);color:var(--tp);background:var(--surface);outline:none}
.inp:focus{border-color:var(--accent)}

.gauge{flex:0 0 150px;text-align:center}
.gauge .lb1{display:block;font:400 15px/20px var(--font);color:var(--g700);margin-top:-30px}

.mx{width:100%;border-collapse:collapse}

/* contextual kebab — driven by what the enrollment currently needs */
function availableActions(){
 const a=A(), acc=a.accItems||[], idv=sec('identity'), onb=sec('onboarding'),
       ses=sec('session'), score=sec('score'), pay=sec('payment'), reg=sec('registration');
 const cancelled=a.stages.some(s=>s.chip[0]==='Cancelled');
 const terminal=!!score||cancelled||a.rejected;
 /* reaching payment means the enrollment was already approved — approval actions no longer apply */
 const reachedPayment=!!pay&&(pay.state==='done'||pay.state==='blocked');
 const preApproval=!terminal&&!reachedPayment&&!a.approvedEnrollment;
 const g=[], needs=[];
 if(preApproval){
   needs.push(['uplus','Approve enrollment','approve']);
   needs.push(['uminus','Reject enrollment','reject','dgr']);
   needs.push(['shield','Override eligibility','eligibility']);
 }
 if(acc.length&&!terminal) needs.push(['gear',acc.some(x=>!x.s)?'Manage accommodations':'Edit accommodations','accommodations']);
 if(idv&&idv.state==='attention') needs.push(['shield','Override IDV result','overrideidvresult']);
 if(onb&&onb.state==='attention') needs.push(['shield','Override onboarding result','overrideonboardingresult']);
 if(needs.length) g.push({items:needs});
 const sch=[];
 if(!terminal&&reg&&reg.state==='upcoming') sch.push(['calp','Extend invitation','extend']);
 if(ses&&!terminal&&ses.state==='done'&&ses.chip[0]==='Booked') sch.push(['calc','Reschedule','reschedule']);
 sch.push(['calp','Re-enroll candidate','reenroll']);
 g.push({items:sch});
 if(!terminal) g.push({items:[['uminus','Cancel enrollment','cancel','dgr']]});
 return g;
}

 if(key==='eligibility'){addLog(a,'a','Eligibility overridden','minimum experience waived · by you');return 'Eligibility overridden';}
 if(key==='overrideidvresult'){const x=sec('identity');if(x){x.chip=['Verified manually','ok'];x.state='done';x.summary='Overridden by you — mismatch accepted';
   x.blocks=[{t:'verdict',k:'ok',html:'<b>Verified manually.</b> You accepted the name mismatch. The original automated result is kept in the activity log.'},
     ...enrollIdentity({fail:false,selfie:'22 Mar 2026 · 10:58 AM',baseFrom:'PY0287 · 08 Jan 2025',attempts:EN_ATT_FAIL}).slice(1,-1),
     ROWSET('Override',[['Original result','Check failed — name mismatch'],['New result','Verified'],['Overridden by','You · '+NOW],['Justification','Legal name change on file.']])];}
   addLog(a,'g','IDV result overridden','check failed → verified · by you');return 'IDV result overridden';}
 if(key==='reenroll'){
   const na={id:'a'+(LIST().length+1),label:'Enrollment '+(LIST().length+1),period:'Invited '+NOW,outcome:null,
    accItems:[{n:'Extended time 1.5×',s:'Approved',by:'Carried over',on:'automatically'}],
    stages:[
     S({key:'registration',title:'Registration form',order:1,state:'upcoming',chip:['Not started','mute'],summary:'Waiting on the candidate',
       blocks:[{t:'verdict',k:'',html:'The candidate has not started the registration form yet.'}]}),
     S({key:'accommodations',title:'Accommodations',order:4,state:'done',chip:['Approved','ok'],summary:'Extended time 1.5× carried over',
       blocks:[{t:'accverdict'},{t:'acc'}]})],
    log:[['n','Invitation sent',NOW,'last date to accept 30 May 2026 · by you'],
         ['g','New attempt created',NOW,'accommodations carried over · by you']]};
   LIST().unshift(na);at=0;stack=[];tab='overview';return na.label+' created';}
 return '';
}

/* ===================== screens ===================== */
function barH(bar,hint){if(!bar||!bar.length)return'';
 return `<div class="ftr">${hint?`<span class="sub">${E(hint)}</span>`:''}<span class="sp"></span>
  ${bar.map((x,i)=>`<button class="btn ${i===bar.length-1?'pri':'sec'} sm" data-act="${E(x[0].toLowerCase().replace(/[^a-z]+/g,''))}">${E(x[0])}</button>`).join('')}</div>`;}
function screenFor(){
 if(action){const s=ACTSCREENS[action]||{title:action,save:'Save',body:()=>'<p class="verdict">Not designed yet.</p>'};
  return {title:s.title,body:s.body(),footer:s.save?{save:s.save,danger:s.danger}:null};}
 const top=stack[stack.length-1];
 if(!top) return null;
 if(VIEWERS[top]) return {title:VIEWERS[top].title,body:VIEWERS[top].body()};
 const s=sec(top); if(!s) return null;
 const acts=s.blocks.filter(b=>b.t==='actions');
 return {title:s.title,chip:s.chip,body:s.blocks.filter(b=>b.t!=='actions').map(blockH).join(''),
   bar:acts.length?acts[0].items:null,
   hint:(s.state==='attention'||s.state==='blocked')?s.summary:''};
}
function screenH(sc){
 return `<div class="screen"><div class="shead">
   <button class="bk" data-back="1"><span class="ar">${I.back}</span><span class="tx">${E(sc.title)}</span></button>
   ${sc.chip?`<span class="rt">${chipH(sc.chip)}</span>`:''}</div>
  <div class="sbody" id="sbody">${sc.body}</div>
  ${sc.footer?`<div class="ftr"><span class="sp"></span><button class="btn sec sm" data-back="1">Cancel</button>
    <button class="btn ${sc.footer.danger?'dgr':'pri'} sm" data-save="1">${E(sc.footer.save)}</button></div>`:barH(sc.bar,sc.hint)}</div>`;
}

function ckey(st){return A().id+'|'+st.key;}
function isOpen(st){const k=ckey(st);return k in cardOpen?cardOpen[k]:(st.state==='attention'||st.state==='blocked');}
/* long stages open on the part that explains the problem, the rest behind View more */
function cardBlocks(st,lean){
 let blocks=st.blocks.filter(b=>b.t!=='actions'&&!(lean&&b.t==='verdict'&&st.state==='done'));
 if(lean) blocks=blocks.map(b=>{
   if(b.t!=='rows') return b;
   const items=b.items.filter(r=>!/^(paid|submitted|received|requested|decided|completed) at$/i.test(String(r[0])));
   if(!items.length) return null;
   const title=(b.title||'').toLowerCase()===st.title.toLowerCase()?'':b.title;
   return (items.length===b.items.length&&title===b.title)?b:{...b,title,items};
 }).filter(Boolean);
 const acts=st.blocks.filter(b=>b.t==='actions');
 const focus=blocks.filter(b=>b.focus);
 const k=ckey(st), more=!!moreOpen[k];
 let shown=blocks, hidden=0;
 if(!more && blocks.length>3){
   const keep=blocks.filter(b=>b.t==='verdict'||b.focus);
   if(keep.length){ shown=keep; hidden=blocks.length-keep.length; }
   else { shown=blocks.slice(0,2); hidden=blocks.length-2; }
 }
 const ft=(hidden||(more&&blocks.length>3)||acts.length);
 return shown.map(blockH).join('')
  + (ft?`<div class="cardft">
      ${hidden?`<button class="txtbtn" data-more="${E(k)}">View ${hidden} more section${hidden>1?'s':''}</button>`:''}
      ${(more&&blocks.length>3)?`<button class="txtbtn" data-more="${E(k)}">Show less</button>`:''}
      <span style="flex:1"></span>
      ${acts.length?acts[0].items.map((x,i)=>`<button class="btn ${i===acts[0].items.length-1?'pri':'sec'} sm" data-act="${E(x[0].toLowerCase().replace(/[^a-z]+/g,''))}">${E(x[0])}</button>`).join(''):''}
    </div>`:'');
}
function cardList(){
 return visibleStages().map(st=>{
  const cls=st.state==='blocked'?'blk':st.state==='attention'?'attn':'';
  const op=isOpen(st);
  return `<div class="scard ${cls} ${op?'open':''}">
    <button class="schead" data-card="${E(st.key)}">
      <span class="mk" title="${E(TTIP[st.state]||'')}">${I[MK[st.state]||'done']}</span>
      <span class="bd"><span class="tt">${E(st.title)}</span><span class="vv">${E(st.summary)}</span></span>
      <span class="rt">${chipH(st.chip)}</span></button>
    <div class="scbody flat">${op?cardBlocks(st):''}</div></div>`;}).join('');
}
function viewC(){
 if(!open) return shell(listChrome());
 const sc=screenFor();
 return shell(listChrome(),`<div class="scrim">
  <div class="drawer">${dside()}
   ${headStrip()}${sc?'':tabRow()}
   ${sc?screenH(sc):`<div class="pbody" id="pbody"><div class="pinner">
     ${tab==='overview'?cardList():timelineH()}</div></div>`}
  </div></div>`);
}
/* ---------- variation A: timeline ---------- */
const TDOT={done:'g',attention:'a',blocked:'r',upcoming:'b'};
const TTIP={done:'Completed',attention:'Needs your decision',blocked:'Blocked — the candidate cannot continue',upcoming:'Not started yet'};
function timelineStages(){
 const byTime=[...visibleStages()].sort((a,b)=>(b.ts||0)-(a.ts||0));
 return `<div class="tmw">${byTime.map(st=>`<div class="tms">
   <span class="tdot ${TDOT[st.state]||'n'}" title="${E(TTIP[st.state]||'')}"></span>
   <div class="thead"><b>${E(st.title)}</b>
     ${st.when?`<span class="twhen">${E(st.when)}${st.time?' &middot; '+E(st.time):''}</span>`:''}
     <span style="flex:1"></span>${chipH(st.chip)}</div>
   ${st.gap?`<div class="tsub"><span class="tgap">${E(st.gap)}</span></div>`:''}
   <div class="tcard">${cardBlocks(st,true)}</div></div>`).join('')}</div>`;
}
function viewA(){
 if(!open) return shell(listChrome());
 const sc=screenFor();
 return shell(listChrome(),`<div class="scrim">
  <div class="drawer">${dside()}
   ${headStrip()}${sc?'':tabRow()}
   ${sc?screenH(sc):`<div class="pbody" id="pbody"><div class="pinner">
     ${tab==='overview'?timelineStages():timelineH()}</div></div>`}
  </div></div>`);
}

/* ===================== mount ===================== */
const root=document.getElementById('root');
const memKey=()=>V+'|'+at+'|'+tab+'|'+stack.join('>');
function saveScroll(){const el=document.getElementById('pbody')||document.getElementById('sbody');if(el)scrollMem[memKey()]=el.scrollTop;}
function restoreScroll(){const el=document.getElementById('pbody')||document.getElementById('sbody');if(el)el.scrollTop=scrollMem[memKey()]||0;}
function render(){syncAcc();root.innerHTML=V==='a'?viewA():viewC();restoreScroll();}
document.querySelectorAll('.proto .seg button').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.proto .seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
 V=b.dataset.v;open=false;stack=[];action=null;at=0;tab='overview';openRow=false;candIdx=0;render();}));
function closeMenu(){document.querySelectorAll('.menu').forEach(m=>m.remove());}
function showMenu(anchor,html,cls){closeMenu();
 const m=document.createElement('div');m.className='menu '+(cls||'');m.innerHTML=html;document.body.appendChild(m);
 const r=anchor.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
 m.style.left=Math.max(10,Math.min(r.left,innerWidth-w-12))+'px';
 m.style.top=(r.bottom+6+h>innerHeight?Math.max(10,r.top-h-6):r.bottom+6)+'px';}
function flash(msg){toast=msg;render();setTimeout(()=>{toast=null;render();},2200);}

document.addEventListener('click',e=>{
 if(!e.target.closest('.menu')) closeMenu();
 const mi=e.target.closest('[data-mi]');
 if(mi){const k=mi.dataset.mi;closeMenu();
   if(k.startsWith('at:')){at=parseInt(k.slice(3));stack=[];action=null;tab='overview';render();return;}
   saveScroll();
   if(k==='accommodations'){action=null;stack=['accommodations'];render();return;}
   action=k;render();return;}
 const mt=e.target.closest('[data-menu]');
 if(mt){e.stopPropagation();
  if(mt.dataset.menu==='parts'){
    showMenu(mt,['Reading (50)','Writing (50)','Listening (30)','Credentialing (30)'].map(x=>`<button>${E(x)}</button>`).join(''));return;}
  if(mt.dataset.menu==='attempt'){
    showMenu(mt,`<div class="lb">Enrollments</div>`+LIST().map((a,i)=>{
      const s=derivedStatusFor(a);
      return `<button class="${i===at?'on':''}" data-mi="at:${i}"><span class="tk">${i===at?I.tick:''}</span>
      <span><span class="al">${E(a.label)}${i===0?' · latest':''}</span>
      <span class="as">${E(a.outcome||s[0])} · ${E(a.period)}</span></span></button>`;}).join(''),'amenu');}
  else{const ga=availableActions();
    showMenu(mt,ga.map((g,gi)=>(gi?'<div class="sep"></div>':'')+
     g.items.map(it=>`<button class="${it[3]||''}" data-mi="${it[2]}">${I[it[0]]}${E(it[1])}</button>`).join('')).join(''));}
  return;}
 if(e.target.closest('[data-exp]')){e.stopPropagation();openRow=!openRow;render();return;}
 const other=e.target.closest('[data-other]');
 if(other){at=parseInt(other.dataset.other)+1;open=true;stack=[];action=null;tab='overview';render();return;}
 const row=e.target.closest('tr[data-row]');
 if(row&&row.dataset.me&&!e.target.closest('.kbtn')){candIdx=parseInt(row.dataset.row);at=0;open=true;stack=[];action=null;tab='overview';render();return;}
 if(e.target.closest('[data-close]')||e.target.matches('.scrim')){open=false;stack=[];action=null;render();return;}
 if(e.target.closest('[data-back]')){if(action){action=null;}else{stack.pop();}render();return;}
 if(e.target.closest('[data-save]')){const k=action;action=null;const msg=applyAction(k)||'Saved';render();flash(msg);return;}
 const tb=e.target.closest('[data-tab]');
 if(tb){saveScroll();tab=tb.dataset.tab;render();return;}
 const gx=e.target.closest('[data-goexam]');
 if(gx){flash('Opening '+gx.dataset.goexam);return;}
 const cn=e.target.closest('[data-cand]');
 if(cn){const d=parseInt(cn.dataset.cand);candIdx=(candIdx+d+ROWS.length)%ROWS.length;
   stack=[];action=null;tab='overview';render();flash('Showing '+ROWS[candIdx].n);return;}
 const cd=e.target.closest('[data-card]');
 if(cd){const st=sec(cd.dataset.card);const k=ckey(st);saveScroll();cardOpen[k]=!isOpen(st);render();return;}
 const mr=e.target.closest('[data-more]');
 if(mr){const k=mr.dataset.more;moreOpen[k]=!moreOpen[k];render();return;}
 const sr=e.target.closest('[data-sec]');
 if(sr){saveScroll();stack=[sr.dataset.sec];render();return;}
 const vw=e.target.closest('[data-view]');
 if(vw){saveScroll();stack.push(vw.dataset.view);render();return;}
 const ac=e.target.closest('[data-act]');
 if(ac){saveScroll();const k=ac.dataset.act;
   if(k==='viewproctoringreport'){stack.push('report');}else action=k;
   render();return;}
 const ch=e.target.closest('[data-accchg]');
 if(ch){const a=A(),i=parseInt(ch.dataset.accchg);a.accItems[i].s=null;delete a.accItems[i].by;delete a.accItems[i].on;
   render();flash(a.accItems[i].n+' — decision cleared');return;}
 const ad=e.target.closest('[data-accdec]');
 if(ad){const p=ad.dataset.accdec.split('|'),i=parseInt(p[0]),dec=p[1],a=A();
   a.accItems[i].s=dec; a.accItems[i].by='You'; a.accItems[i].on=NOW;
   addLog(a,dec==='Approved'?'g':'a','Accommodation '+dec.toLowerCase(),a.accItems[i].n+' · by you');
   render();flash(a.accItems[i].n+' — '+dec.toLowerCase());return;}
});
render();
</script>

</body></html>
