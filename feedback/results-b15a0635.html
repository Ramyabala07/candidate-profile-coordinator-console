<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Score Views Results</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap">
<style>
/* results at a glance: who's ahead, how each view did, what people said. Written comments sit behind one toggle. */
:root{
 --font:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
 --bg:#F3F4F6;--surface:#FFFFFF;--nested:#F9FAFB;--line:#E5E7EB;--line2:#D1D5DB;
 --tp:#111827;--ts:#374151;--tt:#6B7280;--accent:#1D4ED8;
 --spider:#2563EB;--rows:#0D9488;--donut:#7C3AED;
 color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tp);font:400 15px/23px var(--font);-webkit-font-smoothing:antialiased}
main{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font:600 24px/32px var(--font);margin:0}
.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.upd{font:400 12.5px/18px var(--font);color:var(--tt)}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font:500 14px/20px var(--font);color:var(--tp);cursor:pointer;text-decoration:none}
.btn svg{width:14px;height:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin:0 0 14px}
.lab{display:block;font:500 12px/16px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--tt);margin:0 0 10px}
/* the headline */
.lead{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lead .big{font:600 28px/36px var(--font)}
.lead .sub{font:400 14px/20px var(--font);color:var(--ts)}
.bars{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--nested);border:1px solid var(--line);margin:16px 0 8px}
.bars i{display:block;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;font:400 13px/18px var(--font);color:var(--ts)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.legend b{font-weight:500;color:var(--tp)}
/* one column per view */
.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 14px}
.v{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;border-top:3px solid var(--c)}
.v h2{display:flex;justify-content:space-between;align-items:baseline;font:600 16px/22px var(--font);margin:0 0 12px}
.v h2 small{font:500 13px/18px var(--font);color:var(--tt)}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font:400 13.5px/20px var(--font);color:var(--ts)}
.stat b{font-weight:500;color:var(--tp);font-variant-numeric:tabular-nums}
.v .lab{margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--nested);border:1px solid var(--line);font:400 12.5px/18px var(--font);color:var(--ts)}
.chip b{font-weight:600;color:var(--tp)}
.none{font:400 13px/19px var(--font);color:var(--tt)}
/* comments, folded */
details.cm>summary{cursor:pointer;list-style:none;font:500 14px/20px var(--font);color:var(--accent)}
details.cm>summary::-webkit-details-marker{display:none}
.c{padding:12px 0;border-top:1px solid var(--line)}
.c:first-of-type{margin-top:12px}
.c p{margin:0;color:var(--tp)}
.c small{display:block;margin-top:2px;font:400 12px/17px var(--font);color:var(--tt)}
.empty{color:var(--tt);font:400 14px/21px var(--font)}
@media (max-width:760px){.views{grid-template-columns:1fr}}
/* passcode */
.gate{max-width:360px;margin:14vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.gate h1{font:600 22px/30px var(--font);margin:0 0 4px}
.gate input{width:100%;margin:12px 0 10px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;font:inherit}
.gate .btn{width:100%;justify-content:center}
.gate .er{min-height:19px;margin:8px 0 0;font:400 13px/19px var(--font);color:#B91C1C}
</style>
</head>
<body>
<div class="gate" id="gate" hidden><h1>Results</h1><span class="upd">Score views study</span>
 <form id="gf"><input id="pc" type="password" placeholder="Passcode" aria-label="Passcode" autocomplete="current-password">
 <button class="btn" type="submit">Open results</button><p class="er" id="ger" role="alert"></p></form></div>
<main id="res" hidden>
 <div class="top"><h1>Score views · results</h1>
  <div class="acts"><span class="upd" id="upd"></span><button class="btn" id="refresh">Refresh</button><a class="btn" id="sheet" target="_blank" rel="noopener" hidden>Names &amp; emails <svg viewBox="0 0 24 24" fill="none"><path d="M13 5h6v6M19 5l-8 8M17 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div></div>
 <div id="out"><p class="empty">Loading responses…</p></div>
</main>
<script src="config.js?v=20261016b"></script>
<script>
(function(){
 const CFG=window.FEEDBACK_CONFIG||{};
 const VIEWS=[{key:'spider',name:'Spider'},{key:'rows',name:'Level rows'},{key:'donut',name:'Donut'}];
 const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 if(CFG.sheetUrl){const a=document.getElementById('sheet');a.href=CFG.sheetUrl;a.hidden=false;}
 function parseCSV(s){const out=[];let row=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];
   if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
   else if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f='';}else f+=c;}
  if(f.length||row.length){row.push(f);out.push(row);}return out.filter(r=>r.some(x=>x.trim()));}
 async function load(){
  if(!CFG.resultsCsv){render([]);return;}
  try{const r=await fetch(CFG.resultsCsv+'&t='+Date.now());const csv=parseCSV(await r.text());
   const h=csv.shift().map(x=>x.toLowerCase()), ix=k=>h.findIndex(x=>x.includes(k));
   const ic=ix('choice'), iw=ix('why'), id=ix('detail'), it=ix('timestamp');
   render(csv.map(r=>{let d={};try{d=JSON.parse(r[id]||'{}');}catch(e){}return {choice:r[ic],why:r[iw],d,at:r[it]};}));}
  catch(e){document.getElementById('out').innerHTML='<div class="card"><p class="empty">Couldn’t reach the response sheet. Try Refresh.</p></div>';}}
 const pct=(a,b)=>b?Math.round(a/b*100):0;
 const top=(rows,field,n)=>{const m={};rows.forEach(r=>((r.d||{})[field]||[]).forEach(k=>m[k]=(m[k]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);};
 function render(rows){
  document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const out=document.getElementById('out'), N=rows.length;
  if(!N){out.innerHTML='<div class="card"><p class="empty">No responses yet.</p></div>';return;}
  const S=VIEWS.map(v=>{const mine=rows.filter(r=>r.choice===v.name), t=rows.map(r=>((r.d||{}).tasks||{})[v.key]).filter(Boolean);
   const ease=t.map(x=>+x.ease).filter(Boolean);
   return {v,votes:mine.length,found:t.length?pct(t.filter(x=>x.correct).length,t.length)+'%':'—',
    ease:ease.length?(ease.reduce((a,b)=>a+b,0)/ease.length).toFixed(1):'—',reasons:top(mine,'whyChips',3)};});
  const max=Math.max(...S.map(s=>s.votes)), leaders=S.filter(s=>s.votes===max);
  const head=leaders.length>1?leaders.map(s=>s.v.name).join(' and ')+' are tied':leaders[0].v.name+' is ahead';
  const blockers=top(rows,'gotInWay',6).filter(([k])=>!/^Nothing/.test(k));
  const comments=rows.map(r=>({t:[(r.d||{}).whyText,(r.d||{}).confused].filter(Boolean).join(' · '),r})).filter(x=>x.t).reverse();
  out.innerHTML=`
   <div class="card"><span class="lab">${N} response${N>1?'s':''}</span>
    <div class="lead"><span class="big">${esc(head)}</span><span class="sub">${max} of ${N} picked ${leaders.length>1?'each':'it'}</span></div>
    <div class="bars">${S.map(s=>`<i style="width:${pct(s.votes,N)}%;background:var(--${s.v.key})" title="${esc(s.v.name)}: ${s.votes}"></i>`).join('')}</div>
    <div class="legend">${S.map(s=>`<span><i class="dot" style="background:var(--${s.v.key})"></i>${esc(s.v.name)} <b>${s.votes}</b></span>`).join('')}</div></div>
   <div class="views">${S.map(s=>`<div class="v" style="--c:var(--${s.v.key})"><h2>${esc(s.v.name)}<small>${s.votes} vote${s.votes===1?'':'s'}</small></h2>
     <div class="stat"><span>Found the lowest topic</span><b>${s.found}</b></div>
     <div class="stat"><span>Ease, out of 5</span><b>${s.ease}</b></div>
     <span class="lab">Why people picked it</span>
     ${s.reasons.length?`<div class="chips">${s.reasons.map(([k,c])=>`<span class="chip">${esc(k)} <b>${c}</b></span>`).join('')}</div>`:'<p class="none">No votes yet</p>'}</div>`).join('')}</div>
   <div class="card"><span class="lab">What got in the way</span>
    ${blockers.length?`<div class="chips">${blockers.map(([k,c])=>`<span class="chip">${esc(k)} <b>${c}</b></span>`).join('')}</div>`:'<p class="none">Nothing reported yet</p>'}</div>
   <div class="card"><details class="cm"><summary>${comments.length?'Read '+comments.length+' written comment'+(comments.length>1?'s':''):'No written comments yet'}</summary>
    ${comments.map(x=>`<div class="c"><p>${esc(x.t)}</p><small>${esc(x.r.choice)} · ${esc(x.r.at)}</small></div>`).join('')}</details></div>`;}
 document.getElementById('refresh').addEventListener('click',load);
 const H='f87fbbf6e427a1052e8f51a7d8e11f194423a3ab5880daca6100daec906c7130', K='sv-results-ok';
 const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
 const open=()=>{document.getElementById('gate').hidden=true;document.getElementById('res').hidden=false;load();};
 let ok=false; try{ok=localStorage.getItem(K)===H;}catch(e){}
 if(ok) open(); else document.getElementById('gate').hidden=false;
 document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();
  if(await sha(document.getElementById('pc').value.trim())===H){try{localStorage.setItem(K,H);}catch(e){}open();}
  else document.getElementById('ger').textContent='That passcode isn’t right.';});
})();
</script>
</body>
</html>
